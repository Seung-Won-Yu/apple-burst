name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          mkdir -p _site
          cp index.html _site/
          cp game-rules.js _site/
          cp manifest.webmanifest _site/
          cp -R assets _site/assets
          cp -R docs _site/docs
          touch _site/.nojekyll
          printf 'window.APPLE_BURST_FIREBASE_CONFIG = null;\n' > _site/firebase-config.js

          if [ -n "$FIREBASE_CONFIG_JSON" ]; then
            printf 'window.APPLE_BURST_FIREBASE_CONFIG = %s;\n' "$FIREBASE_CONFIG_JSON" > _site/firebase-config.js
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
