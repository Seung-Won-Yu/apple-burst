<body>

<div id="rotate-notice" role="status" aria-live="polite">
    <div class="phone-icon"></div>
    <div class="rotate-title">휴대폰을 세로로 돌려주세요</div>
    <p class="rotate-copy">세로 전체화면에서 큰 사과와 게임판을 편하게 드래그할 수 있어요.</p>
</div>

<main id="game-container">
    <header id="header" aria-label="게임 현황">
        <div class="hud-mark" aria-hidden="true">
            <img src="assets/apple-mascot.png" alt="">
            <span>APPLE<br>BURST</span>
        </div>
        <div class="stat time-stat"><div class="stat-label">시간</div><div id="v-time" class="stat-value">60</div></div>
        <div class="stat right"><div class="stat-label">점수</div><div id="v-score" class="stat-value">0</div></div>
        <button type="button" id="sound-toggle" class="sound-toggle" aria-pressed="false" onclick="Game.toggleSound()">
            <span class="stat-label">효과음</span>
            <span id="sound-state" class="stat-value">끔</span>
        </button>
    </header>

    <div id="stage-wrap">
        <canvas id="stage" aria-label="사과 게임판. 드래그해서 합계 10을 만드세요."></canvas>

        <div id="screen-start" class="overlay">
            <div class="start-hero">
                <div class="brand" aria-label="사과 팡팡">
                    <img src="assets/apple-mascot.png" alt="" aria-hidden="true">
                    <div>
                        <span class="brand-kicker">숫자 드래그 퍼즐</span>
                        <h1>사과 팡팡</h1>
                    </div>
                </div>
                <p class="tagline">합계 10이면 선택한 사과 1개당 1점!</p>
                <div id="challenge-banner" class="challenge-banner hidden"></div>
                <div class="play-preview" aria-label="4와 6을 드래그해 합계 10을 만드는 게임 예시">
                    <div class="preview-selection" aria-hidden="true">
                        <span class="preview-apple"><strong>4</strong></span>
                        <span class="preview-apple"><strong>6</strong></span>
                    </div>
                    <div class="preview-result" aria-hidden="true"><strong>= 10</strong>팡!</div>
                </div>
            </div>

            <div class="start-layout">
                <div id="nick-setting" class="settings-row">
                    <label class="sr-only" for="nick-input">닉네임</label>
                    <input type="text" id="nick-input" placeholder="최고 기록에 표시할 닉네임" maxlength="12" autocomplete="off" spellcheck="false" aria-describedby="nick-help">
                    <div id="nick-help" class="nick-help"></div>
                </div>
                <div class="start-actions">
                    <div id="mode-picker" class="mode-picker" role="group" aria-label="게임 모드">
                        <button type="button" id="mode-rush" class="mode-btn active" aria-pressed="true" onclick="Game.setMode('rush')">60초 스피드</button>
                        <button type="button" id="mode-classic" class="mode-btn" aria-pressed="false" onclick="Game.setMode('classic')">120초 클래식</button>
                    </div>
                    <button type="button" class="apple-play" onclick="Game.start()" aria-label="선택한 모드로 게임 시작">
                        <img src="assets/apple-mascot.png" alt="" aria-hidden="true">
                        <span id="start-button-label">60초 도전 시작</span>
                    </button>
                    <p class="how-to">숫자 합이 10이 되도록 사과를 드래그해 묶으세요.</p>
                </div>
                <div class="settings-row">
                    <div id="rank-container">
                        <div class="rank-head">
                            <div id="rank-title" class="rank-title">내 기기 최고 기록</div>
                            <div id="rank-tabs" class="rank-tabs hidden" role="group" aria-label="랭킹 범위">
                                <button type="button" id="rank-all" class="rank-tab active" aria-pressed="true" onclick="Game.setRankMode('all')">전체</button>
                                <button type="button" id="rank-today" class="rank-tab" aria-pressed="false" onclick="Game.setRankMode('today')">오늘</button>
                            </div>
                        </div>
                        <p id="rank-meta" class="rank-meta">온라인 연결 없이 이 기기에 저장됩니다.</p>
                        <div id="my-rank" class="my-rank hidden"></div>
                        <div id="rank-list" aria-live="polite">첫 기록에 도전해보세요.</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="screen-result" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="res-title" tabindex="-1">
            <h1 id="res-title" class="result-title">시간 끝!</h1>
            <div class="result-card">
                <div class="result-label">최종 점수</div>
                <div id="res-score">0</div>
                <div id="res-detail" class="result-detail"></div>
                <div class="result-grid">
                    <div class="result-chip"><span>모드</span><strong id="res-mode">-</strong></div>
                    <div class="result-chip"><span>플레이 시간</span><strong id="res-time">-</strong></div>
                    <div class="result-chip"><span>터뜨린 사과</span><strong id="res-apples">0</strong></div>
                </div>
            </div>
            <div id="save-state" class="save-state" role="status" aria-live="polite"></div>
            <div class="result-actions">
                <button type="button" class="btn share" onclick="Game.share()">친구에게 도전장</button>
                <button type="button" class="btn" onclick="Game.start()">다시 하기</button>
            </div>
        </div>
    </div>

</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const ONLINE_RANKING_ENABLED = false;
const firebaseConfig = window.APPLE_BURST_FIREBASE_CONFIG || null;
const db = (() => {
    if(!ONLINE_RANKING_ENABLED || typeof firebase === "undefined" || !firebaseConfig || !firebaseConfig.apiKey || !firebaseConfig.databaseURL) return null;
    try {
        firebase.initializeApp(firebaseConfig);
        return firebase.database();
    } catch (error) {
        console.warn(error);
        return null;
    }
})();

const MOBILE_BOARD = Object.freeze({ rows: 12, cols: 6 });
const DESKTOP_BOARD = Object.freeze({ rows: 6, cols: 12 });
let ROWS = MOBILE_BOARD.rows, COLS = MOBILE_BOARD.cols;
const CELL = 52, PAD = 16, DEFAULT_TIME = 60, MAX_NICK = 12, LOW_APPLE_LIMIT = 8;
const DEFAULT_NICK = "플레이어";
const { SCORE_VERSION, scoreForApples } = window.AppleBurstRules;
const MAX_RANK_SCORE = 999999, SAVE_COOLDOWN_MS = 8000;
const TUTORIAL_KEY = `apple_tutorial_seen_v${SCORE_VERSION}`;
const dpr = window.devicePixelRatio || 1;

const Game = {
    canvas: document.getElementById('stage'),
    ctx: document.getElementById('stage').getContext('2d'),
    active: false, dragging: false,
    score: 0, time: DEFAULT_TIME, mode: "rush", modeTime: DEFAULT_TIME,
    cleared: 0, reshuffles: 0,
    playStartedAt: 0, roundEndsAt: 0, scoreSaved: false,
    nick: DEFAULT_NICK, playerKey: "player", latestRanks: [], rankMode: "all", rankFallbackActive: false, composingNick: false,
    grid: [], effects: [], particles: [],
    tutorialHint: null, audioCtx: null, audioMaster: null, audioEnabled: false, soundOn: false,
    toastTimer: null,
    desktopLayout: false,
    pointerType: "mouse",
    mStart: {x:0, y:0}, mCurrent: {x:0, y:0},

    init() {
        this.configureBoardShape();
        this.resizeCanvasForBoard();
        this.nick = this.cleanNick(localStorage.getItem('apple_nick') || "") || DEFAULT_NICK;
        this.soundOn = localStorage.getItem('apple_sound') === "on";
        this.playerKey = this.getPlayerKey(this.nick);
        const nickInput = document.getElementById('nick-input');
        nickInput.value = this.nick === DEFAULT_NICK || this.nick === "PLAYER" ? "" : this.nick;
        this.setMode(localStorage.getItem('apple_mode') || "rush");
        this.configureStartScreen();
        this.loadChallenge();
        this.updateSoundControl();
        this.updateHud();
        this.watchRanks();
        this.bindEvents();
        this.layout();
        this.loop();
    },

    bindEvents() {
        const nickInput = document.getElementById('nick-input');
        nickInput.addEventListener('compositionstart', () => {
            this.composingNick = true;
            this.setNickHelp("");
        });
        nickInput.addEventListener('compositionend', () => {
            this.composingNick = false;
            this.syncNickInput(nickInput);
        });
        nickInput.addEventListener('input', (e) => {
            if(this.composingNick || e.isComposing) return;
            this.syncNickInput(nickInput);
        });
        nickInput.addEventListener('keydown', (e) => {
            if(e.key === "Enter") this.start();
        });
        window.addEventListener('resize', () => this.handleViewportChange());
        window.visualViewport?.addEventListener('resize', () => this.handleViewportChange());
        window.addEventListener('orientationchange', () => setTimeout(() => this.handleViewportChange(), 250));
        document.addEventListener('fullscreenchange', () => this.layout());

        const getPos = (e) => {
            const r = this.canvas.getBoundingClientRect();
            return {
                x: (e.clientX - r.left) * (this.canvas.width / dpr / r.width),
                y: (e.clientY - r.top) * (this.canvas.height / dpr / r.height)
            };
        };
        this.canvas.addEventListener('pointerdown', (e) => {
            if(!this.active) return;
            e.preventDefault();
            this.clearTutorialHint();
            this.dragging = true;
            this.pointerType = e.pointerType || "mouse";
            this.canvas.setPointerCapture?.(e.pointerId);
            this.mStart = getPos(e);
            this.mCurrent = {...this.mStart};
        });
        this.canvas.addEventListener('pointermove', (e) => {
            if(!this.dragging) return;
            e.preventDefault();
            this.mCurrent = getPos(e);
        });
        const endDrag = (e) => {
            if(!this.dragging) return;
            e?.preventDefault?.();
            this.dragging = false;
            if(e?.pointerId !== undefined) this.canvas.releasePointerCapture?.(e.pointerId);
            this.check();
        };
        this.canvas.addEventListener('pointerup', endDrag);
        this.canvas.addEventListener('pointercancel', endDrag);
        this.canvas.addEventListener('lostpointercapture', () => {
            if(this.dragging) {
                this.dragging = false;
                this.check();
            }
        });
    },

    cleanNick(value) {
        return String(value || "")
            .normalize("NFKC")
            .replace(/[^\p{L}\p{N}_ -]/gu, "")
            .replace(/\s+/g, " ")
            .trim()
            .slice(0, MAX_NICK)
            .toUpperCase();
    },

    getPlayerKey(nick) {
        return encodeURIComponent(this.cleanNick(nick).toLowerCase() || "player").slice(0, 90);
    },

    getRankKey(mode = this.mode) {
        return `v${SCORE_VERSION}_${mode}_${this.playerKey}`;
    },

    getModeFromRankKey(key = "") {
        if(String(key).startsWith(`v${SCORE_VERSION}_rush_`)) return "rush";
        if(String(key).startsWith("rush_")) return "rush";
        return "classic";
    },

    getModeLabel(mode = this.mode) {
        return mode === "rush" ? "60초 스피드" : "120초 클래식";
    },

    getBestKey(mode = this.mode) {
        return `apple_best_v${SCORE_VERSION}_${mode}`;
    },

    getLocalBest(mode = this.mode) {
        return Number(localStorage.getItem(this.getBestKey(mode)) || 0);
    },

    setLocalBest(score, mode = this.mode) {
        localStorage.setItem(this.getBestKey(mode), score);
    },

    getSaveCooldownKey(mode = this.mode) {
        return `apple_last_save_v${SCORE_VERSION}_${mode}`;
    },

    validateRankSave() {
        if(!Number.isFinite(this.score) || this.score <= 0 || this.score > MAX_RANK_SCORE) {
            return this.score <= 0 ? "NO_SCORE" : "BAD_SCORE";
        }
        const elapsed = Date.now() - this.playStartedAt;
        const minElapsed = Math.max(45000, this.modeTime * 1000 - 2500);
        if(!this.playStartedAt || elapsed < minElapsed) return "TOO_FAST";
        const lastSave = Number(localStorage.getItem(this.getSaveCooldownKey()) || 0);
        if(Date.now() - lastSave < SAVE_COOLDOWN_MS) return "COOLDOWN";
        return "OK";
    },

    buildShareUrl() {
        const url = new URL(window.location.href);
        url.searchParams.set('challenge', '1');
        url.searchParams.set('mode', this.mode);
        url.searchParams.set('score', Math.max(0, Math.round(this.score)));
        url.searchParams.set('nick', this.nick);
        return url.toString();
    },

    escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
        }[char]));
    },

    setNickHelp(message) {
        document.getElementById('nick-help').innerText = message;
    },

    setSaveState(message, tone = "") {
        const state = document.getElementById('save-state');
        if(!state) return;
        state.className = `save-state ${tone}`.trim();
        state.innerText = message;
    },

    configureStartScreen() {
        const startScreen = document.getElementById('screen-start');
        startScreen.classList.toggle('offline-mode', !ONLINE_RANKING_ENABLED);
    },

    loadChallenge() {
        const params = new URLSearchParams(window.location.search);
        if(params.get('challenge') !== '1') return;
        const mode = params.get('mode') === "rush" ? "rush" : "classic";
        const score = Math.max(0, Math.min(999999, Math.round(Number(params.get('score')) || 0)));
        const nick = this.cleanNick(params.get('nick') || "친구") || "친구";
        if(!score) return;
        this.setMode(mode);
        const banner = document.getElementById('challenge-banner');
        banner.classList.remove('hidden');
        banner.innerHTML = `<strong>${this.escapeHTML(nick)}</strong>님의 ${this.getModeLabel(mode)} 기록 <strong>${score.toLocaleString()}점</strong>에 도전해봐요!`;
    },

    setMode(mode) {
        this.mode = mode === "rush" ? "rush" : "classic";
        this.modeTime = this.mode === "rush" ? 60 : 120;
        this.time = this.active ? this.time : this.modeTime;
        localStorage.setItem('apple_mode', this.mode);
        const rushButton = document.getElementById('mode-rush');
        const classicButton = document.getElementById('mode-classic');
        rushButton?.classList.toggle('active', this.mode === "rush");
        classicButton?.classList.toggle('active', this.mode === "classic");
        rushButton?.setAttribute('aria-pressed', String(this.mode === "rush"));
        classicButton?.setAttribute('aria-pressed', String(this.mode === "classic"));
        const startLabel = document.getElementById('start-button-label');
        if(startLabel) startLabel.textContent = this.mode === "rush" ? "60초 도전 시작" : "120초 도전 시작";
        this.updateHud();
        this.renderRanks(this.latestRanks);
    },

    setRankMode(mode) {
        if(!ONLINE_RANKING_ENABLED) return;
        this.rankMode = mode === "today" ? "today" : "all";
        const allButton = document.getElementById('rank-all');
        const todayButton = document.getElementById('rank-today');
        allButton?.classList.toggle('active', this.rankMode === "all");
        todayButton?.classList.toggle('active', this.rankMode === "today");
        allButton?.setAttribute('aria-pressed', String(this.rankMode === "all"));
        todayButton?.setAttribute('aria-pressed', String(this.rankMode === "today"));
        this.renderRanks(this.latestRanks);
    },

    todayRange() {
        const start = new Date();
        start.setHours(0, 0, 0, 0);
        const end = new Date(start);
        end.setDate(end.getDate() + 1);
        return { start: start.getTime(), end: end.getTime(), label: start.toLocaleDateString('ko-KR') };
    },

    showToast(message) {
        const toast = document.getElementById('toast');
        if(!toast) return;
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => toast.classList.remove('show'), 2100);
    },

    isTouchDevice() {
        return window.matchMedia('(pointer: coarse)').matches;
    },

    isDesktopWide() {
        return window.matchMedia('(min-width: 900px) and (pointer: fine)').matches;
    },

    configureBoardShape() {
        this.desktopLayout = this.isDesktopWide();
        const board = this.desktopLayout ? DESKTOP_BOARD : MOBILE_BOARD;
        ROWS = board.rows;
        COLS = board.cols;
        document.body.dataset.layout = this.desktopLayout ? "desktop" : "mobile";
        this.canvas.setAttribute(
            'aria-label',
            `사과 게임판 ${COLS}열 ${ROWS}행. 드래그해서 합계 10을 만드세요.`
        );
    },

    resizeCanvasForBoard() {
        this.canvas.width = (COLS * CELL + PAD * 2) * dpr;
        this.canvas.height = (ROWS * CELL + PAD * 2) * dpr;
        this.ctx = this.canvas.getContext('2d');
        this.ctx.scale(dpr, dpr);
    },

    handleViewportChange() {
        const nextDesktop = this.isDesktopWide();
        if(nextDesktop !== this.desktopLayout) {
            if(this.grid.length) {
                this.grid = this.grid[0].map((_, column) => this.grid.map((row) => row[column]));
            }
            this.desktopLayout = nextDesktop;
            const board = nextDesktop ? DESKTOP_BOARD : MOBILE_BOARD;
            ROWS = board.rows;
            COLS = board.cols;
            document.body.dataset.layout = nextDesktop ? "desktop" : "mobile";
            this.canvas.setAttribute(
                'aria-label',
                `사과 게임판 ${COLS}열 ${ROWS}행. 드래그해서 합계 10을 만드세요.`
            );
            this.effects = [];
            this.particles = [];
            this.tutorialHint = null;
            this.resizeCanvasForBoard();
        }
        this.layout();
    },

    syncChromeWidth(canvasWidth = null) {
        const container = document.getElementById('game-container');
        const wrap = document.getElementById('stage-wrap');
        if(!container || !wrap) return;
        const style = getComputedStyle(wrap);
        const px = (value) => Number.parseFloat(value) || 0;
        const frameX = px(style.paddingLeft) + px(style.paddingRight) + px(style.borderLeftWidth) + px(style.borderRightWidth);
        const measuredCanvasWidth = canvasWidth || this.canvas.getBoundingClientRect().width;
        const width = Math.ceil(measuredCanvasWidth + frameX);
        if(width > 0) container.style.setProperty('--chrome-width', `${width}px`);
    },

    layout() {
        const baseW = COLS * CELL + PAD * 2;
        const baseH = ROWS * CELL + PAD * 2;
        const viewport = window.visualViewport || { width: window.innerWidth, height: window.innerHeight };
        const container = document.getElementById('game-container');
        const header = document.getElementById('header');
        const wrap = document.getElementById('stage-wrap');
        const px = (value) => Number.parseFloat(value) || 0;
        const containerStyle = getComputedStyle(container);
        const wrapStyle = getComputedStyle(wrap);
        const frameX = px(wrapStyle.paddingLeft) + px(wrapStyle.paddingRight) + px(wrapStyle.borderLeftWidth) + px(wrapStyle.borderRightWidth);
        const frameY = px(wrapStyle.paddingTop) + px(wrapStyle.paddingBottom) + px(wrapStyle.borderTopWidth) + px(wrapStyle.borderBottomWidth);
        const containerX = px(containerStyle.paddingLeft) + px(containerStyle.paddingRight);
        const containerY = px(containerStyle.paddingTop) + px(containerStyle.paddingBottom);
        let scale;
        if(this.desktopLayout) {
            const headerW = header ? header.offsetWidth : 126;
            const gridGap = px(containerStyle.columnGap);
            const containerW = Math.min(viewport.width * 0.96, 1180);
            const availableW = Math.max(560, containerW - containerX - headerW - gridGap - frameX);
            const availableH = Math.max(330, viewport.height - containerY - frameY);
            scale = Math.min(availableW / baseW, availableH / baseH, 1.45);
        } else {
            const headerH = header ? header.offsetHeight : 50;
            const headerGap = px(getComputedStyle(header).marginBottom);
            const availableW = Math.max(1, Math.min(430, viewport.width - containerX - frameX));
            const availableH = Math.max(1, viewport.height - containerY - headerH - headerGap - frameY);
            scale = Math.min(availableW / baseW, availableH / baseH);
        }
        const canvasW = Math.floor(baseW * scale);
        this.canvas.style.width = `${canvasW}px`;
        this.canvas.style.maxHeight = "none";
        this.syncChromeWidth(canvasW);
    },

    lockPortrait() {
        const lock = window.screen?.orientation?.lock;
        if(typeof lock !== "function") return;
        try {
            const result = lock.call(window.screen.orientation, "portrait");
            result?.catch?.(() => {});
        } catch(error) {
            // iOS Safari 등 orientation lock 미지원 브라우저는 회전 안내로 대응한다.
        }
    },

    enterFullscreen() {
        if(!this.isTouchDevice() || document.fullscreenElement || document.webkitFullscreenElement) return;
        const el = document.documentElement;
        const request = el.requestFullscreen || el.webkitRequestFullscreen;
        if(!request) {
            this.lockPortrait();
            window.scrollTo(0, 1);
            this.layout();
            return;
        }
        try {
            const result = request.call(el, { navigationUI: "hide" });
            if(result && typeof result.then === "function") {
                result.then(() => {
                    this.lockPortrait();
                    setTimeout(() => this.layout(), 250);
                }).catch(() => {
                    window.scrollTo(0, 1);
                    this.layout();
                });
            } else {
                this.lockPortrait();
                setTimeout(() => this.layout(), 250);
            }
        } catch(error) {
            this.layout();
        }
    },

    haptic(type) {
        if(!navigator.vibrate) return;
        if(type === "hit") navigator.vibrate([18]);
        if(type === "miss") navigator.vibrate([8]);
    },

    primeAudio() {
        if(!this.soundOn) return Promise.resolve(false);
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if(!AudioContext) return Promise.resolve(false);
        if(!this.audioCtx) {
            this.audioCtx = new AudioContext();
            this.audioMaster = this.audioCtx.createGain();
            this.audioMaster.gain.value = 0.9;
            this.audioMaster.connect(this.audioCtx.destination);
        }
        const resume = this.audioCtx.state === "suspended"
            ? this.audioCtx.resume()
            : Promise.resolve();
        return resume.then(() => {
            this.audioEnabled = this.soundOn && this.audioCtx.state === "running";
            if(this.audioMaster) {
                this.audioMaster.gain.cancelScheduledValues(this.audioCtx.currentTime);
                this.audioMaster.gain.setTargetAtTime(this.soundOn ? 0.9 : 0.0001, this.audioCtx.currentTime, 0.01);
            }
            return this.audioEnabled;
        }).catch(() => {
            this.audioEnabled = false;
            return false;
        });
    },

    async toggleSound() {
        this.soundOn = !this.soundOn;
        this.audioEnabled = this.soundOn;
        localStorage.setItem('apple_sound', this.soundOn ? "on" : "off");
        this.updateSoundControl();
        this.showToast(this.soundOn ? "효과음을 켰어요" : "효과음을 껐어요");
        if(this.soundOn) {
            const ready = await this.primeAudio();
            if(ready && this.soundOn) this.playSound("ready");
        } else if(this.audioMaster && this.audioCtx) {
            this.audioMaster.gain.cancelScheduledValues(this.audioCtx.currentTime);
            this.audioMaster.gain.setTargetAtTime(0.0001, this.audioCtx.currentTime, 0.008);
        }
    },

    updateSoundControl() {
        const button = document.getElementById('sound-toggle');
        const state = document.getElementById('sound-state');
        button?.setAttribute('aria-pressed', String(this.soundOn));
        button?.setAttribute('aria-label', this.soundOn ? "효과음 끄기" : "효과음 켜기");
        if(state) state.textContent = this.soundOn ? "켬" : "끔";
    },

    playSound(type, detail = {}) {
        if(!this.soundOn || !this.audioEnabled || !this.audioCtx || !this.audioMaster || this.audioCtx.state !== "running") return;
        const ctx = this.audioCtx;
        const now = ctx.currentTime;
        const schedule = ({ at = 0, from, to = from, duration, volume, wave = "sine" }) => {
            const startAt = now + at;
            const gain = ctx.createGain();
            const osc = ctx.createOscillator();
            osc.type = wave;
            osc.frequency.setValueAtTime(Math.max(1, from), startAt);
            osc.frequency.exponentialRampToValueAtTime(Math.max(1, to), startAt + duration);
            gain.gain.setValueAtTime(0.0001, startAt);
            gain.gain.exponentialRampToValueAtTime(volume, startAt + Math.min(0.018, duration * 0.25));
            gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
            osc.connect(gain);
            gain.connect(this.audioMaster);
            osc.addEventListener('ended', () => {
                osc.disconnect();
                gain.disconnect();
            }, { once: true });
            osc.start(startAt);
            osc.stop(startAt + duration + 0.02);
        };

        const hitPitch = 540 + Math.min(7, Number(detail.points) || 1) * 24;
        const cues = {
            ready: [
                { from: 620, to: 720, duration: 0.07, volume: 0.022, wave: "triangle" },
                { at: 0.075, from: 820, to: 920, duration: 0.09, volume: 0.026, wave: "triangle" },
            ],
            start: [
                { from: 392, duration: 0.065, volume: 0.02, wave: "triangle" },
                { at: 0.075, from: 523, duration: 0.065, volume: 0.022, wave: "triangle" },
                { at: 0.15, from: 659, to: 720, duration: 0.11, volume: 0.028, wave: "triangle" },
            ],
            hit: [
                { from: hitPitch * 0.72, to: hitPitch, duration: 0.075, volume: 0.034, wave: "triangle" },
                { at: 0.04, from: hitPitch * 1.18, to: hitPitch * 1.42, duration: 0.08, volume: 0.018, wave: "sine" },
            ],
            miss: [
                { from: 180, to: 112, duration: 0.14, volume: 0.026, wave: "sine" },
            ],
            shuffle: [
                { from: 420, to: 720, duration: 0.13, volume: 0.018, wave: "triangle" },
                { at: 0.08, from: 640, to: 980, duration: 0.15, volume: 0.022, wave: "sine" },
            ],
            tick: [
                { from: 760 + (5 - Math.max(1, Number(detail.remaining) || 5)) * 35, duration: 0.045, volume: 0.016, wave: "square" },
            ],
            end: [
                { from: 392, to: 330, duration: 0.12, volume: 0.021, wave: "triangle" },
                { at: 0.13, from: 294, to: 220, duration: 0.16, volume: 0.02, wave: "sine" },
            ],
            best: [
                { from: 523, duration: 0.08, volume: 0.022, wave: "triangle" },
                { at: 0.085, from: 659, duration: 0.08, volume: 0.024, wave: "triangle" },
                { at: 0.17, from: 784, duration: 0.09, volume: 0.026, wave: "triangle" },
                { at: 0.265, from: 1047, to: 1110, duration: 0.14, volume: 0.03, wave: "sine" },
            ],
        };
        (cues[type] || cues.hit).forEach(schedule);
    },

    makeApple() {
        return { val: Math.floor(Math.random() * 9) + 1, scale: 0, removed: false };
    },

    newBoard() {
        return Array.from({length: ROWS}, () => Array.from({length: COLS}, () => this.makeApple()));
    },

    buildPlayableBoard() {
        let guard = 0;
        do {
            this.grid = this.newBoard();
            guard++;
        } while(!this.hasAnyTen() && guard < 20);
    },

    activeCount() {
        let count = 0;
        for(let r = 0; r < ROWS; r++) {
            for(let c = 0; c < COLS; c++) {
                if(this.grid[r]?.[c] && !this.grid[r][c].removed) count++;
            }
        }
        return count;
    },

    findTenSelection() {
        if(!this.grid.length) return null;
        const sums = Array.from({length: ROWS + 1}, () => Array(COLS + 1).fill(0));
        for(let r = 0; r < ROWS; r++) {
            for(let c = 0; c < COLS; c++) {
                const apple = this.grid[r]?.[c];
                const value = apple && !apple.removed ? apple.val : 0;
                sums[r + 1][c + 1] = value + sums[r][c + 1] + sums[r + 1][c] - sums[r][c];
            }
        }
        for(let r1 = 0; r1 < ROWS; r1++) {
            for(let c1 = 0; c1 < COLS; c1++) {
                for(let r2 = r1; r2 < ROWS; r2++) {
                    for(let c2 = c1; c2 < COLS; c2++) {
                        const sum = sums[r2 + 1][c2 + 1] - sums[r1][c2 + 1] - sums[r2 + 1][c1] + sums[r1][c1];
                        if(sum === 10) {
                            const items = [];
                            for(let r = r1; r <= r2; r++) {
                                for(let c = c1; c <= c2; c++) {
                                    if(this.grid[r]?.[c] && !this.grid[r][c].removed) items.push({r, c});
                                }
                            }
                            return {
                                items,
                                rect: {
                                    x: PAD + c1 * CELL,
                                    y: PAD + r1 * CELL,
                                    w: (c2 - c1 + 1) * CELL,
                                    h: (r2 - r1 + 1) * CELL,
                                },
                                center: {
                                    x: PAD + (c1 + c2 + 1) * CELL / 2,
                                    y: PAD + (r1 + r2 + 1) * CELL / 2,
                                },
                            };
                        }
                    }
                }
            }
        }
        return null;
    },

    hasAnyTen() {
        return !!this.findTenSelection();
    },

    maybeShowTutorialHint() {
        if(localStorage.getItem(TUTORIAL_KEY) === "1") {
            this.tutorialHint = null;
            return;
        }
        const hint = this.findTenSelection();
        if(!hint) return;
        this.tutorialHint = { ...hint, startedAt: performance.now(), duration: 3000 };
        localStorage.setItem(TUTORIAL_KEY, "1");
    },

    clearTutorialHint() {
        this.tutorialHint = null;
    },

    refreshBoard(message) {
        this.buildPlayableBoard();
        this.reshuffles++;
        const centerX = (COLS * CELL + PAD * 2) / 2;
        const centerY = (ROWS * CELL + PAD * 2) / 2;
        this.spawnEffect(message, centerX, centerY, '#f4b63a');
        this.spawnBurst(centerX, centerY);
        this.flashBoard('hit');
        this.haptic("hit");
        this.playSound("shuffle");
    },

    ensureBoard() {
        if(!this.active) return;
        const remaining = this.activeCount();
        if(remaining <= LOW_APPLE_LIMIT) {
            this.refreshBoard("다시 섞기");
        } else if(!this.hasAnyTen()) {
            this.refreshBoard("새 조합");
        }
    },

    syncNickInput(nickInput) {
        const before = nickInput.value;
        const clean = this.cleanNick(before);
        if(before !== clean) {
            nickInput.value = clean;
            this.setNickHelp("사용할 수 없는 문자는 제거했어요.");
        } else {
            this.setNickHelp("");
        }
        this.nick = clean || DEFAULT_NICK;
        this.playerKey = this.getPlayerKey(this.nick);
        this.renderRanks(this.latestRanks);
    },

    watchRanks() {
        const list = document.getElementById('rank-list');
        if(!ONLINE_RANKING_ENABLED || !db) {
            this.renderRanks([]);
            return;
        }
        db.ref('ranks').orderByChild('score').on('value', (snapshot) => {
            const rows = this.rowsFromSnapshot(snapshot);
            this.latestRanks = rows;
            this.renderRanks(rows);
        }, (error) => {
            console.warn(error);
            if(this.rankFallbackActive) return;
            this.rankFallbackActive = true;
            db.ref('ranks').on('value', (snapshot) => {
                const rows = this.rowsFromSnapshot(snapshot);
                this.latestRanks = rows;
                this.renderRanks(rows);
            }, () => {
                list.innerHTML = `<div class="rank-empty">랭킹을 불러오지 못했습니다.</div>`;
            });
        });
    },

    rowsFromSnapshot(snapshot) {
        const rows = [];
        snapshot.forEach((child) => {
            const data = child.val() || {};
            const score = Number(data.score);
            if(!Number.isFinite(score) || score <= 0) return;
            const version = Number(data.version) || (String(child.key).startsWith(`v${SCORE_VERSION}_`) ? SCORE_VERSION : 1);
            if(version !== SCORE_VERSION) return;
            rows.push({
                key: child.key,
                mode: this.getModeFromRankKey(child.key),
                nick: this.cleanNick(data.nick) || DEFAULT_NICK,
                score: Math.max(0, Math.round(score)),
                updatedAt: Number(data.updatedAt) || 0,
            });
        });
        rows.sort((a, b) => b.score - a.score);
        return rows;
    },

    renderRanks(rows = []) {
        const list = document.getElementById('rank-list');
        const meta = document.getElementById('rank-meta');
        const myRankBox = document.getElementById('my-rank');
        const myBest = this.getLocalBest();
        const rankTitle = document.getElementById('rank-title');
        const rankTabs = document.getElementById('rank-tabs');
        const modeLabel = this.getModeLabel();

        if(!ONLINE_RANKING_ENABLED) {
            if(rankTitle) rankTitle.textContent = "내 기기 최고 기록";
            rankTabs?.classList.add('hidden');
            meta.innerText = `${modeLabel} · 온라인 연결 없이 이 기기에 저장`;
            myRankBox.classList.add('hidden');
            myRankBox.innerHTML = "";
            list.innerHTML = myBest
                ? `<div class="local-best-card"><span>내 최고점</span><strong>${myBest.toLocaleString()}점</strong></div>`
                : `<div class="rank-empty">첫 기록에 도전해보세요.</div>`;
            return;
        }

        if(rankTitle) rankTitle.textContent = "온라인 TOP 10";
        rankTabs?.classList.remove('hidden');
        const { start, end, label } = this.todayRange();
        const modeRows = rows
            .filter(row => row.mode === this.mode)
            .slice()
            .sort((a, b) => b.score - a.score);
        const scopedRows = (this.rankMode === "today"
            ? modeRows.filter(row => row.updatedAt >= start && row.updatedAt < end)
            : modeRows
        ).slice().sort((a, b) => b.score - a.score);
        const topRows = scopedRows.slice(0, 10);
        const rankKey = this.getRankKey();
        const myIndex = scopedRows.findIndex(row => row.key === rankKey || row.nick === this.nick);
        const myRow = myIndex >= 0 ? scopedRows[myIndex] : null;
        meta.innerText = this.rankMode === "today"
            ? `${label} ${modeLabel} · 오늘 갱신된 최고점`
            : `${modeLabel} 전체 랭킹 · 닉네임별 최고점 · 총 ${modeRows.length.toLocaleString()}명`;

        if(myRow) {
            myRankBox.classList.remove('hidden');
            myRankBox.innerHTML = `
                <span>#${myIndex + 1}</span>
                <span class="rank-name">내 순위</span>
                <span class="rank-score">${myRow.score.toLocaleString()}</span>
            `;
        } else if(myBest) {
            myRankBox.classList.remove('hidden');
            myRankBox.innerHTML = `
                <span>#-</span>
                <span class="rank-name">내 최고점</span>
                <span class="rank-score">${myBest.toLocaleString()}</span>
            `;
        } else {
            myRankBox.classList.add('hidden');
            myRankBox.innerHTML = "";
        }

        if(!topRows.length) {
            list.innerHTML = myBest
                ? `<div class="rank-empty">아직 이 탭에 랭킹이 없습니다.</div>`
                : `<div class="rank-empty">아직 랭킹이 없습니다.</div>`;
            return;
        }
        list.innerHTML = topRows.map((row, index) => {
            const isMe = row.key === rankKey || row.nick === this.nick;
            return `
                <div class="rank-item ${isMe ? "me" : ""}">
                    <span>#${index + 1}</span>
                    <span class="rank-name">${this.escapeHTML(row.nick)}</span>
                    <span class="rank-score">${row.score.toLocaleString()}</span>
                </div>
            `;
        }).join("");
    },

    start() {
        const audioReady = this.primeAudio();
        this.enterFullscreen();
        const nickInput = document.getElementById('nick-input');
        this.nick = this.cleanNick(nickInput.value) || DEFAULT_NICK;
        this.playerKey = this.getPlayerKey(this.nick);
        nickInput.value = this.nick === DEFAULT_NICK ? "" : this.nick;
        localStorage.setItem('apple_nick', this.nick);
        this.buildPlayableBoard();
        this.score = 0; this.time = this.modeTime; this.cleared = 0; this.reshuffles = 0; this.effects = []; this.particles = []; this.active = true;
        this.maybeShowTutorialHint();
        this.playStartedAt = Date.now();
        this.roundEndsAt = this.playStartedAt + this.modeTime * 1000;
        this.scoreSaved = false;
        audioReady.then((ready) => {
            if(ready && this.active) this.playSound("start");
        });
        this.setNickHelp("");
        this.setSaveState("");
        document.getElementById('screen-start').classList.add('hidden');
        document.getElementById('screen-result').classList.add('hidden');
        this.updateHud();
        this.layout();
        if(this.timer) clearInterval(this.timer);
        this.timer = setInterval(() => {
            const nextTime = Math.max(0, Math.ceil((this.roundEndsAt - Date.now()) / 1000));
            if(nextTime !== this.time) {
                this.time = nextTime;
                this.updateHud();
                if(nextTime > 0 && nextTime <= 5) this.playSound("tick", { remaining: nextTime });
            }
            if(nextTime <= 0) this.end();
        }, 200);
    },

    end() {
        if(!this.active) return;
        this.active = false; clearInterval(this.timer);
        this.updateHud();
        const myBest = this.getLocalBest();
        const isNewBest = this.score > myBest;
        if(isNewBest) this.setLocalBest(this.score);
        this.playSound(isNewBest ? "best" : "end");

        document.getElementById('res-title').innerText = isNewBest ? "새 기록!" : "시간 끝!";
        document.getElementById('res-score').innerText = this.score.toLocaleString();
        const modeLabel = this.getModeLabel();
        document.getElementById('res-detail').innerText = `${this.nick} · 최고 ${Math.max(myBest, this.score).toLocaleString()}점`;
        document.getElementById('res-mode').innerText = modeLabel;
        document.getElementById('res-time').innerText = `${this.modeTime}초`;
        document.getElementById('res-apples').innerText = this.cleared.toLocaleString();
        this.saveScore();
        const resultScreen = document.getElementById('screen-result');
        resultScreen.classList.remove('hidden');
        requestAnimationFrame(() => resultScreen.focus({ preventScroll: true }));
    },

    saveScore() {
        if(this.scoreSaved) {
            this.setSaveState(ONLINE_RANKING_ENABLED ? "랭킹 확인 완료" : "기기 기록 확인 완료", ONLINE_RANKING_ENABLED ? "online" : "local");
            return;
        }
        this.scoreSaved = true;
        if(!ONLINE_RANKING_ENABLED || !db) {
            if(this.score <= 0) {
                this.setSaveState("다음 판에서 기록에 도전해요", "local");
                return;
            }
            this.setSaveState("기기 최고점 저장 완료", "local");
            this.showToast("이 기기에 최고점을 저장했어요");
            return;
        }
        const saveStatus = this.validateRankSave();
        if(saveStatus !== "OK") {
            const messages = {
                NO_SCORE: ["저장할 점수가 없어요", "0점은 랭킹에 저장하지 않아요"],
                BAD_SCORE: ["랭킹 저장 차단", "비정상 점수는 저장하지 않아요"],
                TOO_FAST: ["랭킹 저장 차단", "플레이 시간이 너무 짧아 저장하지 않았어요"],
                COOLDOWN: ["잠깐 쉬었다 저장", "너무 잦은 저장은 잠시 막아요"],
            };
            const [label, toast] = messages[saveStatus] || messages.BAD_SCORE;
            this.setSaveState(label, "blocked");
            this.showToast(toast);
            return;
        }
        const payload = {
            nick: this.nick,
            score: Math.round(this.score),
            version: SCORE_VERSION,
            updatedAt: firebase.database.ServerValue.TIMESTAMP,
        };
        localStorage.setItem(this.getSaveCooldownKey(), Date.now());
        this.setSaveState("온라인 랭킹 저장 중...", "saving");
        db.ref(`ranks/${this.getRankKey()}`).transaction((current) => {
            if(current && Number(current.score) >= payload.score) return;
            return payload;
        }, (error, committed) => {
            if(error) {
                console.warn(error);
                this.setSaveState("온라인 랭킹 저장 실패", "blocked");
                this.showToast("랭킹 저장 실패");
                return;
            }
            this.setSaveState(committed ? "온라인 최고점 저장 완료" : "온라인 최고점 유지", committed ? "online" : "local");
            this.showToast(committed ? `${this.getModeLabel()} 랭킹 저장 완료` : `${this.getModeLabel()} 기존 최고점이 더 높아요`);
        });
    },

    share() {
        const modeLabel = this.getModeLabel();
        const text = `${this.nick}님이 사과 팡팡 ${modeLabel}에서 ${this.score.toLocaleString()}점을 달성! 내 점수 이겨봐.`;
        const shareUrl = this.buildShareUrl();
        const message = `${text} ${shareUrl}`;
        if(navigator.share) {
            navigator.share({ title: '사과 팡팡', text: message }).catch(() => {
                navigator.clipboard?.writeText(message).then(() => this.showToast("공유 문구를 복사했어요"));
            });
        } else if(navigator.clipboard) {
            navigator.clipboard.writeText(message).then(() => this.showToast("공유 문구를 복사했어요"));
        } else {
            window.prompt("공유 문구를 복사해주세요", message);
        }
    },

    check() {
        const sel = this.getSel();
        if(sel.sum === 10 && sel.items.length) {
            const points = scoreForApples(sel.items.length);
            this.score += points;
            this.cleared += sel.items.length;
            sel.items.forEach(p => this.grid[p.r][p.c].removed = true);
            this.spawnEffect(`+${points}`, sel.center.x, sel.center.y, '#2477ff');
            this.playSound("hit", { points });
            this.spawnBurst(sel.center.x, sel.center.y);
            this.flashBoard('hit');
            this.pulseScore();
            this.haptic("hit");
            setTimeout(() => this.ensureBoard(), 320);
        } else {
            if(sel.items.length) {
                this.flashBoard('miss');
                this.haptic("miss");
                this.playSound("miss");
            }
            this.ensureBoard();
        }
        this.updateHud();
    },

    getSel() {
        const x1 = Math.min(this.mStart.x, this.mCurrent.x)-PAD, y1 = Math.min(this.mStart.y, this.mCurrent.y)-PAD;
        const x2 = Math.max(this.mStart.x, this.mCurrent.x)-PAD, y2 = Math.max(this.mStart.y, this.mCurrent.y)-PAD;
        const cs = Math.floor(x1/CELL), ce = Math.floor(x2/CELL), rs = Math.floor(y1/CELL), re = Math.floor(y2/CELL);
        let sum = 0, items = [];
        for(let r=Math.max(0,rs); r<=Math.min(ROWS-1,re); r++) {
            for(let c=Math.max(0,cs); c<=Math.min(COLS-1,ce); c++) {
                if(this.grid[r] && !this.grid[r][c].removed) { sum += this.grid[r][c].val; items.push({r, c}); }
            }
        }
        const center = items.length
            ? {
                x: (items.reduce((total, item) => total + item.c, 0) / items.length) * CELL + CELL / 2 + PAD,
                y: (items.reduce((total, item) => total + item.r, 0) / items.length) * CELL + CELL / 2 + PAD,
            }
            : { x: this.mCurrent.x, y: this.mCurrent.y };
        return { sum, items, center };
    },

    spawnEffect(text, x, y, color) {
        this.effects.push({ text, x, y, color, life: 42 });
    },

    spawnBurst(x, y) {
        const colors = ['#f04d3f', '#f4b63a', '#2f9d67'];
        const count = 12;
        for(let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.8 + Math.random() * 2.8;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 0.6,
                color: colors[i % colors.length],
                life: 28 + Math.random() * 18,
                size: 2 + Math.random() * 3,
            });
        }
    },

    drawApple(apple, selected) {
        const ctx = this.ctx;
        const drawBodyPath = () => {
            ctx.beginPath();
            ctx.moveTo(0, -16);
            ctx.bezierCurveTo(-3, -18, -7, -17, -8, -14);
            ctx.bezierCurveTo(-17, -20, -22, -7, -20, 6);
            ctx.bezierCurveTo(-17, 22, -5, 22, 0, 16);
            ctx.bezierCurveTo(5, 22, 17, 22, 20, 6);
            ctx.bezierCurveTo(22, -7, 17, -20, 8, -14);
            ctx.bezierCurveTo(7, -17, 3, -18, 0, -16);
            ctx.closePath();
        };

        ctx.save();
        const appleScale = 1.1 * (selected ? 1.07 : 1);
        ctx.scale(appleScale, appleScale);

        if(selected) {
            const halo = ctx.createRadialGradient(0, 2, 9, 0, 2, 28);
            halo.addColorStop(0, 'rgba(255, 229, 116, 0.5)');
            halo.addColorStop(1, 'rgba(255, 229, 116, 0)');
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(0, 2, 28, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = 'rgba(73, 43, 20, 0.2)';
        ctx.beginPath();
        ctx.ellipse(0, 18, 16, 4.5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowColor = 'transparent';
        ctx.fillStyle = '#68401f';
        this.drawRoundRect(ctx, -2.2, -22, 4.4, 10, 2);
        ctx.fill();

        const leafFill = ctx.createLinearGradient(2, -22, 13, -15);
        leafFill.addColorStop(0, '#39b861');
        leafFill.addColorStop(1, '#08763e');
        ctx.fillStyle = leafFill;
        ctx.beginPath();
        ctx.ellipse(8, -18.5, 7, 3.8, -0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(5, 91, 46, 0.42)';
        ctx.lineWidth = 1;
        ctx.stroke();

        const appleFill = ctx.createRadialGradient(-8, -11, 4, 3, 4, 22);
        appleFill.addColorStop(0, '#ffad7a');
        appleFill.addColorStop(0.18, '#fb6848');
        appleFill.addColorStop(0.58, '#ed3f2d');
        appleFill.addColorStop(1, '#a9231a');

        ctx.shadowColor = 'rgba(92, 30, 12, 0.3)';
        ctx.shadowBlur = 3;
        ctx.shadowOffsetY = 4;
        drawBodyPath();
        ctx.fillStyle = appleFill;
        ctx.fill();

        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = selected ? '#ffe173' : 'rgba(118, 28, 20, 0.68)';
        ctx.lineWidth = selected ? 3 : 1.6;
        drawBodyPath();
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.ellipse(-8.5, -9.5, 6.5, 3.2, -0.58, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.beginPath();
        ctx.ellipse(7, 1, 3.5, 9, -0.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 3, 12.8, 0, Math.PI * 2);
        ctx.fillStyle = '#fff9e9';
        ctx.fill();
        ctx.strokeStyle = selected ? '#f4bd27' : 'rgba(92, 30, 18, 0.46)';
        ctx.lineWidth = selected ? 2.5 : 1.5;
        ctx.stroke();

        ctx.font = "900 21px Montserrat, 'Noto Sans KR'";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineJoin = "round";
        ctx.fillStyle = '#34251b';
        ctx.fillText(apple.val, 0, 3);
        ctx.restore();
    },

    drawRoundRect(ctx, x, y, w, h, radius) {
        ctx.beginPath();
        if(ctx.roundRect) {
            ctx.roundRect(x, y, w, h, radius);
            return;
        }
        const r = Math.min(radius, w / 2, h / 2);
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    },

    drawTutorialHint(now) {
        const hint = this.tutorialHint;
        if(!this.active || !hint) return;
        const elapsed = now - hint.startedAt;
        if(elapsed > hint.duration) {
            this.tutorialHint = null;
            return;
        }
        const fade = elapsed > hint.duration - 650 ? Math.max(0, (hint.duration - elapsed) / 650) : 1;
        const pulse = 1 + Math.sin(elapsed / 150) * 0.06;
        const ctx = this.ctx;
        const x = hint.rect.x - 5;
        const y = hint.rect.y - 5;
        const w = hint.rect.w + 10;
        const h = hint.rect.h + 10;
        const label = "합계 10";

        ctx.save();
        ctx.globalAlpha = fade;
        ctx.fillStyle = 'rgba(255, 215, 68, 0.14)';
        ctx.strokeStyle = '#ff8a1c';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        this.drawRoundRect(ctx, x, y, w, h, 10);
        ctx.fill();
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.font = "900 17px Montserrat, 'Noto Sans KR'";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const labelW = ctx.measureText(label).width + 28;
        const labelX = hint.center.x;
        const labelY = Math.max(25, y - 18);
        ctx.translate(labelX, labelY);
        ctx.scale(pulse, pulse);
        this.drawRoundRect(ctx, -labelW / 2, -16, labelW, 32, 16);
        ctx.fillStyle = 'rgba(255, 252, 241, 0.94)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 138, 28, 0.58)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#203024';
        ctx.fillText(label, 0, 1);
        ctx.restore();
    },

    flashBoard(type) {
        const wrap = document.getElementById('stage-wrap');
        wrap.classList.remove(type);
        void wrap.offsetWidth;
        wrap.classList.add(type);
        setTimeout(() => wrap.classList.remove(type), 280);
    },

    pulseScore() {
        const score = document.getElementById('v-score');
        if(!score) return;
        score.classList.remove('score-pop');
        void score.offsetWidth;
        score.classList.add('score-pop');
        setTimeout(() => score.classList.remove('score-pop'), 260);
    },

    updateHud() {
        document.getElementById('v-time').innerText = this.time;
        document.getElementById('v-score').innerText = this.score.toLocaleString();
        const ratio = this.modeTime > 0 ? Math.max(0, Math.min(1, this.time / this.modeTime)) : 0;
        document.getElementById('header')?.style.setProperty('--time-progress', ratio);
        document.querySelector('.time-stat')?.classList.toggle('warning', this.active && this.time <= 10);
    },

    loop() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        const boardW = COLS * CELL + PAD * 2;
        const boardH = ROWS * CELL + PAD * 2;
        this.ctx.save();
        this.ctx.fillStyle = '#fffaf0';
        this.ctx.fillRect(0, 0, boardW, boardH);
        for(let r = 0; r < ROWS; r++) {
            for(let c = 0; c < COLS; c++) {
                this.ctx.fillStyle = (r + c) % 2 ? '#fffaf0' : '#eef7e7';
                this.ctx.fillRect(PAD + c * CELL, PAD + r * CELL, CELL, CELL);
            }
        }
        this.ctx.strokeStyle = 'rgba(7, 93, 59, 0.075)';
        this.ctx.lineWidth = 1;
        for(let c = 0; c <= COLS; c++) {
            const x = PAD + c * CELL;
            this.ctx.beginPath();
            this.ctx.moveTo(x, PAD);
            this.ctx.lineTo(x, PAD + ROWS * CELL);
            this.ctx.stroke();
        }
        for(let r = 0; r <= ROWS; r++) {
            const y = PAD + r * CELL;
            this.ctx.beginPath();
            this.ctx.moveTo(PAD, y);
            this.ctx.lineTo(PAD + COLS * CELL, y);
            this.ctx.stroke();
        }
        this.ctx.restore();

        const now = performance.now();
        const selItems = this.dragging ? this.getSel().items : [];
        const hintItems = this.tutorialHint && now - this.tutorialHint.startedAt <= this.tutorialHint.duration
            ? this.tutorialHint.items
            : [];

        for(let r=0; r<ROWS; r++) {
            for(let c=0; c<COLS; c++) {
                if(!this.grid[r]) continue;
                const a = this.grid[r][c];
                a.scale += ((a.removed ? 0 : 1) - a.scale) * 0.15;
                if(a.scale > 0.01) {
                    this.ctx.save();
                    this.ctx.translate(c*CELL + CELL/2 + PAD, r*CELL + CELL/2 + PAD);
                    this.ctx.scale(a.scale, a.scale);
                    const selected = selItems.some(s=>s.r===r && s.c===c) || hintItems.some(s=>s.r===r && s.c===c);
                    this.drawApple(a, selected);
                    this.ctx.restore();
                }
            }
        }
        this.drawTutorialHint(now);
        if(this.dragging) {
            const sel = this.getSel();
            const isComplete = sel.sum === 10;
            this.ctx.strokeStyle = isComplete ? '#ff3f1f' : '#2477ff';
            this.ctx.fillStyle = isComplete ? 'rgba(255,63,31,0.12)' : 'rgba(36,119,255,0.08)';
            this.ctx.lineWidth = isComplete ? 3 : 2;
            this.ctx.setLineDash([5,5]);
            this.ctx.fillRect(this.mStart.x, this.mStart.y, this.mCurrent.x-this.mStart.x, this.mCurrent.y-this.mStart.y);
            this.ctx.strokeRect(this.mStart.x, this.mStart.y, this.mCurrent.x-this.mStart.x, this.mCurrent.y-this.mStart.y);
            this.ctx.setLineDash([]);
            if(sel.sum > 0) {
                const isTouch = this.pointerType === "touch" || this.pointerType === "pen";
                const label = isComplete ? "합계 10!" : `${sel.sum} / 10`;
                this.ctx.font = "900 18px Montserrat, 'Noto Sans KR'";
                this.ctx.textAlign = "center";
                this.ctx.textBaseline = "middle";
                const labelW = Math.max(74, this.ctx.measureText(label).width + 26);
                const labelH = 34;
                const labelX = Math.max(labelW / 2 + 6, Math.min(boardW - labelW / 2 - 6, this.mCurrent.x));
                const wantedY = this.mCurrent.y - (isTouch ? 64 : 30);
                const labelY = Math.max(labelH / 2 + 6, Math.min(boardH - labelH / 2 - 6, wantedY));

                this.drawRoundRect(this.ctx, labelX - labelW / 2, labelY - labelH / 2, labelW, labelH, 17);
                this.ctx.fillStyle = 'rgba(255,252,241,0.96)';
                this.ctx.fill();
                this.ctx.strokeStyle = isComplete ? 'rgba(255,63,31,0.72)' : 'rgba(36,119,255,0.52)';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();
                this.ctx.fillStyle = isComplete ? '#d7351c' : '#203024';
                this.ctx.fillText(label, labelX, labelY + 1);
                if(isTouch) {
                    this.ctx.strokeStyle = 'rgba(36,119,255,0.42)';
                    this.ctx.lineWidth = 1;
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.mCurrent.x, this.mCurrent.y - 12);
                    this.ctx.lineTo(labelX, labelY + labelH / 2);
                    this.ctx.stroke();
                }
            }
        }
        this.effects = this.effects.filter(effect => effect.life > 0);
        this.effects.forEach((effect) => {
            this.ctx.save();
            this.ctx.globalAlpha = Math.max(0, effect.life / 42);
            this.ctx.fillStyle = effect.color;
            this.ctx.font = "900 26px Montserrat, 'Noto Sans KR'";
            this.ctx.textAlign = "center";
            this.ctx.fillText(effect.text, effect.x, effect.y);
            this.ctx.restore();
            effect.y -= 0.7;
            effect.life--;
        });
        this.particles = this.particles.filter(particle => particle.life > 0);
        this.particles.forEach((particle) => {
            this.ctx.save();
            this.ctx.globalAlpha = Math.max(0, particle.life / 46);
            this.ctx.fillStyle = particle.color;
            this.ctx.beginPath();
            this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.restore();
            particle.x += particle.vx;
            particle.y += particle.vy;
            particle.vy += 0.08;
            particle.life--;
        });
        requestAnimationFrame(() => this.loop());
    }
};

Game.init();
</script>
</body>
</html>
