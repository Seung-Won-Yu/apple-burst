<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#09c95d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>사과 팡팡</title>
    <link rel="icon" type="image/png" href="assets/apple-mascot.png">
    <link rel="manifest" href="manifest.webmanifest">
    <script src="game-rules.js"></script>
    <!-- 온라인 랭킹은 모바일 게임성 검증 기간 동안 기본 비활성화한다. -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+KR:wght@700;900&display=swap');

        :root {
            --bg: #f7f7ef;
            --frame: #09c95d;
            --frame-dark: #05a94d;
            --frame-light: #3ee781;
            --board: #f8fff3;
            --board-alt: #eaf8e2;
            --ink: #203024;
            --muted: #5d6b5f;
            --apple: #ff3f1f;
            --apple-dark: #c92b16;
            --leaf: #1fa84f;
            --accent: #ff8a1c;
            --gold: #ffd744;
            --line: rgba(5, 106, 42, 0.2);
            --shadow: 0 11px 0 rgba(0, 111, 47, 0.23), 0 20px 30px rgba(13, 74, 31, 0.16);
            --surface: rgba(255,255,255,0.86);
            --radius-sm: 4px;
            --radius-md: 8px;
            --motion-fast: 160ms ease;
        }
        body {
            margin: 0; background: var(--bg); color: var(--ink);
            font-family: 'Montserrat', 'Noto Sans KR', sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100svh; width: 100vw; overflow: hidden; user-select: none; touch-action: manipulation;
            background:
                linear-gradient(45deg, rgba(9,201,93,0.045) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(9,201,93,0.045) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(9,201,93,0.045) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(9,201,93,0.045) 75%),
                var(--bg);
            background-position: 0 0, 0 12px, 12px -12px, -12px 0;
            background-size: 24px 24px;
        }
        /* 게임판은 세로형이다. 낮은 가로 화면에서 세로 전환을 안내한다. */
        #rotate-notice {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; text-align: center;
            padding: calc(28px + env(safe-area-inset-top)) calc(28px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(28px + env(safe-area-inset-left));
            box-sizing: border-box;
        }
        @media (orientation: landscape) and (pointer: coarse) and (max-height: 500px) {
            #rotate-notice { display: flex; }
            #game-container { display: none !important; }
        }
        .phone-icon { width: 44px; height: 76px; border: 3px solid var(--ink); border-radius: 12px; animation: phone-pulse 1.6s ease-in-out infinite; }
        .rotate-title { font-size: 22px; font-weight: 900; }
        .rotate-copy { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
        @keyframes phone-pulse { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        #game-container {
            --chrome-width: 430px;
            position: relative; display: flex; flex-direction: column; align-items: center;
            width: min(calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right)), 440px);
            padding: max(4px, env(safe-area-inset-top)) 4px max(4px, env(safe-area-inset-bottom));
            box-sizing: border-box;
        }

        /* UI */
        #header { --time-progress: 1; width: min(100%, var(--chrome-width)); display: grid; grid-template-columns: repeat(3, 1fr); align-items: stretch; gap: 0; margin-bottom: 6px; overflow: hidden; box-sizing: border-box; background: var(--surface); border: 1px solid rgba(5,106,42,0.18); border-radius: var(--radius-md); box-shadow: 0 3px 0 rgba(5,106,42,0.08); }
        .hud-mark { display: none; }
        .stat { position: relative; display: grid; grid-template-rows: auto auto; align-content: center; justify-items: center; min-height: 50px; min-width: 0; box-sizing: border-box; padding: 3px 7px; text-align: center; overflow: hidden; transition: background-color var(--motion-fast); }
        .stat + .stat, .stat + .sound-toggle { border-left: 1px solid rgba(5,106,42,0.16); }
        .stat.center, .stat.right { align-items: center; justify-self: auto; }
        .stat.warning { background: rgba(255,235,224,0.94); }
        .stat-label { font-size: 9px; color: var(--muted); letter-spacing: 0; }
        .stat.warning .stat-label { color: #9f3b22; }
        .stat-value { font-size: clamp(22px, 4vh, 30px); font-weight: 900; line-height: 1; color: var(--ink); }
        .stat.warning .stat-value { color: var(--apple); }
        .time-stat::after {
            content: ""; position: absolute; left: 0; bottom: 0; width: calc(var(--time-progress) * 100%); height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--apple)); transform-origin: left center;
            transition: width 0.2s linear, background-color var(--motion-fast);
        }
        .time-stat.warning::after { background: var(--apple); }
        #v-score.score-pop { animation: score-pop 0.24s ease-out; color: var(--apple); }
        @keyframes score-pop { 0% { transform: scale(1); } 45% { transform: scale(1.24); } 100% { transform: scale(1); } }
        .sound-toggle {
            display: grid; grid-template-rows: auto auto; align-content: center; justify-items: center;
            min-height: 50px; min-width: 0; padding: 3px 7px; border: 0; background: transparent;
            color: var(--ink); font-family: inherit; cursor: pointer;
        }
        .sound-toggle .stat-value { font-size: 16px; }
        .sound-toggle[aria-pressed="true"] { background: rgba(9,201,93,0.1); }
        .sound-toggle:active { background: rgba(9,201,93,0.16); }

        #stage-wrap {
            --stage-pad-top: 4px;
            --stage-pad-x: 4px;
            --stage-pad-bottom: 12px;
            position: relative; background: linear-gradient(#24d977, var(--frame));
            border-radius: 14px; padding: var(--stage-pad-top) var(--stage-pad-x) var(--stage-pad-bottom);
            border: 1px solid rgba(0,95,38,0.24); box-shadow: var(--shadow);
            transition: filter 0.2s, box-shadow 0.2s; overflow: hidden;
        }
        #stage-wrap::after {
            content: ""; position: absolute; left: 44px; right: 44px; bottom: 4px; height: 5px;
            border-radius: 999px; background: rgba(255,255,255,0.36); box-shadow: inset 0 2px 2px rgba(255,255,255,0.35);
            pointer-events: none;
        }
        #stage-wrap.hit { animation: hit-pulse 0.28s ease-out; }
        #stage-wrap.miss { animation: miss-shake 0.18s ease-out; }
        canvas { display: block; border-radius: 3px; cursor: crosshair; width: min(100%, 430px); max-width: 100%; max-height: none; height: auto; touch-action: none; box-shadow: inset 0 0 0 2px rgba(0,120,50,0.18), 0 1px 0 rgba(255,255,255,0.45); }
        @keyframes hit-pulse { 0% { transform: scale(1); } 45% { transform: scale(1.008); } 100% { transform: scale(1); } }
        @keyframes miss-shake { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-4px); } 65% { transform: translateX(4px); } }

        /* 오버레이 */
        .overlay {
            position: absolute; top: var(--stage-pad-top); left: var(--stage-pad-x); right: var(--stage-pad-x); bottom: var(--stage-pad-bottom); width: auto; height: auto;
            background:
                linear-gradient(45deg, rgba(255,255,255,0.64) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.64) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.64) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.64) 75%),
                rgba(232, 255, 217, 0.96);
            background-position: 0 0, 0 16px, 16px -16px, -16px 0;
            background-size: 32px 32px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; border-radius: 3px; text-align: center; padding: 32px; box-sizing: border-box;
        }
        .overlay:not(.hidden) { animation: overlay-in 0.18s ease-out; }
        .hidden { display: none !important; }
        @keyframes overlay-in { from { opacity: 0; transform: scale(0.992); } to { opacity: 1; transform: scale(1); } }
        #screen-start { flex-direction: column; gap: 0; padding: 18px; }

        .start-hero { width: min(100%, 360px); display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; }
        .start-layout { width: min(100%, 360px); display: flex; flex-direction: column; align-items: stretch; gap: 7px; margin-top: 7px; }
        .brand { display: inline-grid; grid-template-columns: 46px auto; align-items: center; gap: 7px; margin-bottom: 5px; }
        .brand img { width: 46px; height: 46px; object-fit: contain; filter: drop-shadow(0 4px 0 rgba(88,32,12,0.18)); }
        h1 { font-size: clamp(32px, 6vw, 42px); margin: 0; color: #35c83f; line-height: 0.9; text-shadow: -3px 0 #fff, 0 3px #fff, 3px 0 #fff, 0 -3px #fff, 0 6px 0 rgba(0,120,46,0.2); }
        .brand-kicker { display: block; color: var(--accent); font-size: 12px; line-height: 1; text-align: left; text-shadow: -2px 0 #fff, 0 2px #fff, 2px 0 #fff, 0 -2px #fff; }
        .tagline { margin: 0; color: var(--ink); font-size: 12px; font-weight: 700; line-height: 1.45; }
        .play-preview {
            width: min(100%, 300px); display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 8px; padding: 7px 8px; box-sizing: border-box;
            border: 1px solid rgba(5,169,77,0.28); border-radius: 8px;
            background: rgba(255,255,255,0.74); box-shadow: inset 0 -2px 0 rgba(5,106,42,0.06);
        }
        .preview-selection {
            position: relative; display: flex; align-items: center; gap: 6px; padding: 5px 8px;
            border: 2px dashed rgba(36,119,255,0.72); border-radius: 8px; background: rgba(36,119,255,0.06);
        }
        .preview-selection::after {
            content: "드래그"; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%);
            padding: 1px 6px; border-radius: 999px; background: #fff; color: #2254a7; font-size: 8px; white-space: nowrap;
        }
        .preview-apple {
            position: relative; display: grid; place-items: center; width: 42px; height: 42px;
            border: 2px solid var(--apple-dark); border-radius: 44% 44% 48% 48%;
            background: radial-gradient(circle at 32% 22%, #ff8a57 0 15%, var(--apple) 42%, var(--apple-dark) 100%);
            box-shadow: 0 3px 0 rgba(126,43,22,0.18);
        }
        .preview-apple::before {
            content: ""; position: absolute; top: -6px; right: 6px; width: 13px; height: 7px;
            border-radius: 100% 0 100% 0; background: var(--leaf); transform: rotate(-18deg);
        }
        .preview-apple strong {
            display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
            background: #fffdf0; color: #3a2419; font-size: 16px; line-height: 1;
            box-shadow: inset 0 0 0 1px rgba(99,31,17,0.4);
        }
        .preview-result { color: var(--apple); font-size: 15px; font-weight: 900; white-space: nowrap; }
        .preview-result strong { display: block; font-size: 24px; line-height: 1; }
        .how-to { margin: 0 0 2px; color: var(--muted); font-size: 10px; line-height: 1.45; }
        .start-actions { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
        .apple-play {
            width: 100%; min-height: 54px; border: 1px solid rgba(122,39,28,0.3); border-radius: 9px; padding: 7px 18px; margin: 0;
            display: flex; align-items: center; justify-content: center; gap: 9px;
            background: linear-gradient(#ff6a45, var(--apple)); position: relative; cursor: pointer;
            font-family: inherit; color: #fff; font-weight: 900; font-size: 18px;
            box-shadow: 0 5px 0 rgba(122,39,28,0.22); transition: transform var(--motion-fast), filter var(--motion-fast);
        }
        .apple-play img { width: 38px; height: 38px; object-fit: contain; }
        .apple-play span { text-shadow: 0 2px 0 rgba(90,20,8,0.28); }
        .apple-play:hover { transform: translateY(-2px); }
        .apple-play:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(122,39,28,0.2); }
        .mode-picker { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin: 0; }
        .mode-btn { width: 100%; min-width: 0; min-height: 44px; padding: 8px 9px; border: 1px solid rgba(5,106,42,0.28); border-radius: var(--radius-sm); background: rgba(255,255,255,0.75); color: var(--muted); font-family: inherit; font-size: 11px; font-weight: 900; cursor: pointer; box-shadow: inset 0 -2px 0 rgba(5,106,42,0.08); transition: color var(--motion-fast), background-color var(--motion-fast), border-color var(--motion-fast), transform var(--motion-fast); }
        .mode-btn.active { border-color: var(--frame-dark); background: #fff; color: var(--frame-dark); box-shadow: inset 0 -2px 0 rgba(5,106,42,0.16); }
        .mode-btn:hover, .rank-tab:hover { border-color: var(--frame-dark); color: var(--frame-dark); }
        .mode-btn:active, .rank-tab:active { transform: translateY(1px); }
        .settings-row { width: 100%; display: flex; flex-direction: column; align-items: stretch; gap: 7px; }
        input { width: 100%; box-sizing: border-box; background: #fff; border: 2px solid var(--frame-dark); color: var(--ink); padding: 10px 12px; border-radius: 5px; font-size: 17px; text-align: center; outline: none; font-family: inherit; text-transform: uppercase; box-shadow: inset 0 2px 0 rgba(0,0,0,0.04); }
        input::placeholder { color: rgba(124,102,88,0.58); }
        input:focus { box-shadow: 0 0 0 3px rgba(255,138,28,0.24); border-color: var(--accent); }
        button:focus-visible, input:focus-visible { outline: 3px solid rgba(36,119,255,0.5); outline-offset: 3px; }
        .overlay:focus { outline: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
        input, button, #rank-container, .overlay { touch-action: manipulation; }
        .nick-help, .result-detail { color: var(--muted); font-size: 11px; min-height: 15px; margin-bottom: 0; }
        .result-detail { color: var(--ink); }
        .save-state {
            display: inline-flex; align-items: center; justify-content: center; min-height: 26px; margin-bottom: 8px;
            padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,0.74); border: 1px solid var(--line);
            color: var(--muted); font-size: 12px; font-weight: 900; box-sizing: border-box;
        }
        .save-state:empty { visibility: hidden; }
        .save-state.local { background: rgba(244,182,58,0.18); border-color: rgba(244,182,58,0.45); color: #8b6412; }
        .save-state.online { background: rgba(9,201,93,0.14); border-color: rgba(5,169,77,0.45); color: var(--frame-dark); }
        .save-state.saving { background: rgba(36,119,255,0.12); border-color: rgba(36,119,255,0.42); color: #2254a7; }
        .save-state.blocked { background: rgba(255,63,31,0.12); border-color: rgba(255,63,31,0.34); color: #b83b20; }
        .challenge-banner { width: min(86%, 430px); margin: 0 0 10px; padding: 10px 12px; border-radius: var(--radius-md); background: rgba(244,182,58,0.18); border: 1px solid rgba(244,182,58,0.46); color: var(--ink); font-size: 12px; line-height: 1.45; }
        .challenge-banner strong { color: var(--gold); }
        .result-title { margin: 0 0 12px; font-size: clamp(36px, 6vw, 60px); }
        .result-card { width: min(88%, 460px); padding: 18px; border-radius: var(--radius-md); background: #fff; border: 2px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,0.6); margin-bottom: 12px; }
        .result-label { color: var(--muted); font-size: 11px; letter-spacing: 0; }
        #res-score { font-size: clamp(42px, 8vw, 68px); line-height: 1; margin: 8px 0 12px; color: var(--apple); text-shadow: 0 3px 0 rgba(244,182,58,0.24); }
        .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
        .result-chip { border-radius: 8px; background: rgba(47,157,103,0.08); padding: 9px 7px; }
        .result-chip span { display: block; color: var(--muted); font-size: 9px; }
        .result-chip strong { display: block; margin-top: 3px; font-size: 14px; color: var(--ink); }
        
        .btn { padding: 10px 26px; font-size: 17px; font-weight: 900; background: linear-gradient(#ff6a45, var(--apple)); color: white; border: 1px solid rgba(122,39,28,0.25); border-radius: 5px; cursor: pointer; margin: 4px; font-family: inherit; transition: transform 0.15s, filter 0.15s; box-shadow: 0 5px 0 rgba(122, 39, 28, 0.24); }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(122,39,28,0.2); }
        .btn.share { background: #fff; border-color: rgba(5,169,77,0.62); color: var(--frame-dark); box-shadow: 0 5px 0 rgba(34,104,67,0.14); }
        .result-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .result-actions .btn { min-width: 154px; margin: 0; }

        /* 랭킹 리스트 */
        #rank-container { width: 100%; max-height: min(34svh, 214px); overflow-y: auto; background: rgba(255,255,255,0.84); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font-size: 13px; box-sizing: border-box; }
        .rank-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .rank-title { color: var(--frame-dark); font-size: 12px; }
        .rank-tabs { display: flex; gap: 5px; }
        .rank-tab { min-height: 32px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--muted); padding: 5px 10px; font: inherit; font-size: 10px; cursor: pointer; transition: color var(--motion-fast), background-color var(--motion-fast), border-color var(--motion-fast); }
        .rank-tab.active { background: rgba(36,119,255,0.12); border-color: rgba(36,119,255,0.62); color: var(--ink); }
        .rank-meta { color: var(--muted); font-size: 10px; line-height: 1.4; margin: 0 0 6px; text-align: left; }
        .my-rank { display: grid; grid-template-columns: 54px 1fr auto; gap: 8px; align-items: center; color: #9b6812; background: rgba(244,182,58,0.16); border: 1px solid rgba(244,182,58,0.34); border-radius: 8px; padding: 7px 8px; margin-bottom: 7px; }
        .rank-item { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; padding: 6px 2px; border-bottom: 1px solid var(--line); }
        .rank-item:last-child { border-bottom: 0; }
        .rank-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
        .rank-score { color: var(--ink); }
        .rank-item.me { color: var(--accent); font-weight: bold; background: rgba(36,119,255,0.08); border-radius: 8px; padding-left: 6px; padding-right: 6px; }
        .rank-empty { min-height: 46px; display: grid; place-items: center; color: var(--muted); padding: 12px 0; box-sizing: border-box; }
        .local-best-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 8px 4px; color: var(--muted); }
        .local-best-card strong { color: var(--apple); font-size: 24px; }
        #screen-start.offline-mode #nick-setting { display: none; }
        #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 18px); z-index: 10000; min-width: min(88vw, 320px); max-width: 90vw; padding: 12px 16px; border-radius: 999px; background: rgba(47, 157, 103, 0.94); color: #fff; font-size: 13px; font-weight: 900; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.18s, transform 0.18s; box-shadow: 0 14px 34px rgba(34,104,67,0.22); }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }

        @media (min-width: 900px) and (pointer: fine) {
            body {
                background:
                    radial-gradient(circle at 12% 18%, rgba(255, 138, 28, 0.10) 0 4px, transparent 5px),
                    radial-gradient(circle at 88% 74%, rgba(9, 201, 93, 0.11) 0 5px, transparent 6px),
                    linear-gradient(45deg, rgba(9,201,93,0.045) 25%, transparent 25%),
                    linear-gradient(-45deg, rgba(9,201,93,0.045) 25%, transparent 25%),
                    linear-gradient(45deg, transparent 75%, rgba(9,201,93,0.045) 75%),
                    linear-gradient(-45deg, transparent 75%, rgba(9,201,93,0.045) 75%),
                    var(--bg);
                background-size: 180px 180px, 220px 220px, 24px 24px, 24px 24px, 24px 24px, 24px 24px;
            }
            #game-container {
                width: min(96vw, 1180px); display: grid; grid-template-columns: 126px minmax(0, 1fr);
                align-items: stretch; gap: 14px; padding: 12px;
            }
            #header {
                width: 126px; height: 100%; grid-template-columns: 1fr; grid-template-rows: 92px repeat(3, 1fr);
                margin: 0; border-radius: 14px; box-shadow: 0 7px 0 rgba(5,106,42,0.10);
            }
            .hud-mark {
                display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
                padding: 8px 5px; color: var(--frame-dark); border-bottom: 1px solid rgba(5,106,42,0.16);
                background: rgba(232,255,217,0.74);
            }
            .hud-mark img { width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 3px 0 rgba(88,32,12,0.14)); }
            .hud-mark span { font-size: 9px; line-height: 1.1; }
            .stat, .sound-toggle { min-height: 0; padding: 8px 5px; }
            .stat + .stat, .stat + .sound-toggle { border-left: 0; border-top: 1px solid rgba(5,106,42,0.16); }
            .stat-label { font-size: 11px; }
            .stat-value { font-size: 38px; }
            .sound-toggle .stat-value { font-size: 18px; }
            #stage-wrap { align-self: center; --stage-pad-top: 7px; --stage-pad-x: 7px; --stage-pad-bottom: 17px; border-radius: 18px; }
            #stage-wrap::after { bottom: 6px; height: 6px; }
            canvas { width: min(100%, 760px); }

        /* Premium orchard arcade art pass */
        :root {
            --bg: #f3efe3;
            --frame: #0f9a58;
            --frame-dark: #075d3b;
            --frame-light: #54dc8c;
            --board: #fffaf0;
            --board-alt: #eef7e7;
            --ink: #173426;
            --muted: #617267;
            --apple: #f0442f;
            --apple-dark: #a9231a;
            --leaf: #138447;
            --accent: #f58a24;
            --gold: #f6c84c;
            --line: rgba(7, 93, 59, 0.18);
            --surface: rgba(255, 253, 247, 0.96);
            --shadow: 0 7px 0 #075d3b, 0 17px 34px rgba(21, 66, 43, 0.22);
            --radius-sm: 10px;
            --radius-md: 16px;
        }
        body {
            background:
                radial-gradient(circle at 12% 14%, rgba(246, 200, 76, 0.19) 0 5px, transparent 6px),
                radial-gradient(circle at 88% 78%, rgba(15, 154, 88, 0.13) 0 7px, transparent 8px),
                radial-gradient(circle at 50% 105%, rgba(15, 154, 88, 0.10), transparent 38%),
                linear-gradient(135deg, rgba(255,255,255,0.6), rgba(240,235,220,0.34)),
                var(--bg);
            background-size: 180px 180px, 220px 220px, auto, auto, auto;
        }
        body::before,
        body::after {
            content: ""; position: fixed; z-index: -1; pointer-events: none;
            width: 250px; height: 250px; border-radius: 50%;
            filter: blur(2px); opacity: 0.55;
        }
        body::before { left: -120px; top: -120px; background: rgba(246, 200, 76, 0.16); }
        body::after { right: -130px; bottom: -130px; background: rgba(15, 154, 88, 0.13); }
        #game-container { isolation: isolate; }

        #header {
            background: var(--surface);
            border: 1px solid rgba(7, 93, 59, 0.22);
            border-radius: 16px;
            box-shadow: 0 5px 16px rgba(32, 68, 48, 0.12), inset 0 1px 0 #fff;
        }
        .stat { min-height: 54px; padding: 4px 8px; }
        .stat-label {
            color: #6b7b70; font-size: 9px; font-weight: 900;
            letter-spacing: 0.08em;
        }
        .stat-value { color: #163727; letter-spacing: -0.04em; }
        .stat + .stat,
        .stat + .sound-toggle { border-color: rgba(7, 93, 59, 0.13); }
        .sound-toggle { min-height: 54px; border-radius: 0 15px 15px 0; }
        .sound-toggle .stat-value { color: var(--frame-dark); font-size: 15px; letter-spacing: -0.02em; }
        .sound-toggle[aria-pressed="true"] { background: #e7f6e9; }
        .time-stat::after {
            height: 4px;
            background: linear-gradient(90deg, #f6c84c, #f58a24 62%, #f0442f);
        }

        #stage-wrap {
            background: linear-gradient(145deg, #20bd6c, #0a854c);
            border: 2px solid #075d3b;
            border-radius: 20px;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.62);
        }
        #stage-wrap::before {
            content: ""; position: absolute; z-index: 2; pointer-events: none;
            left: 18px; right: 18px; top: 2px; height: 2px;
            border-radius: 999px; background: rgba(255,255,255,0.52);
        }
        #stage-wrap::after {
            background: rgba(255,255,255,0.48);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.8), 0 1px 0 rgba(3,73,38,0.35);
        }
        canvas {
            border-radius: 11px;
            box-shadow: inset 0 0 0 1px rgba(7,93,59,0.13), 0 2px 5px rgba(3,65,35,0.25);
        }

        .overlay {
            overflow: hidden;
            border-radius: 11px;
            background:
                radial-gradient(circle at 8% 12%, rgba(246,200,76,0.16) 0 3px, transparent 4px),
                radial-gradient(circle at 92% 84%, rgba(15,154,88,0.12) 0 4px, transparent 5px),
                linear-gradient(145deg, rgba(255,255,255,0.76), transparent 45%),
                #fff9ec;
            background-size: 130px 130px, 170px 170px, auto, auto;
        }
        .overlay::before,
        .overlay::after {
            content: ""; position: absolute; z-index: 0; pointer-events: none;
            width: 150px; height: 150px; border: 22px solid rgba(15,154,88,0.045); border-radius: 50%;
        }
        .overlay::before { left: -100px; top: -90px; }
        .overlay::after { right: -105px; bottom: -100px; border-color: rgba(246,200,76,0.08); }
        .start-hero,
        .start-layout,
        #screen-result > * { position: relative; z-index: 1; }
        .brand {
            grid-template-columns: 56px auto;
            gap: 9px; margin-bottom: 7px;
        }
        .brand img {

        .brand-kicker {

        .tagline { color: #385044; font-size: 12px; }
