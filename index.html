<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사과 팡팡: 오늘의 챔피언</title>
    <link rel="icon" type="image/png" href="assets/apple-mascot.png">
    <script src="game-rules.js"></script>
    <!-- Firebase SDK (실시간 랭킹용) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+KR:wght@700;900&display=swap');

        :root {
            --bg: #f7f7ef;
            --frame: #09c95d;
            --frame-dark: #05a94d;
            --frame-light: #3ee781;
            --board: #f8fff3;
            --board-alt: #eaf8e2;
            --ink: #203024;
            --muted: #5d6b5f;
            --apple: #ff3f1f;
            --apple-dark: #c92b16;
            --leaf: #1fa84f;
            --accent: #ff8a1c;
            --gold: #ffd744;
            --line: rgba(5, 106, 42, 0.2);
            --shadow: 0 14px 0 rgba(0, 111, 47, 0.25), 0 24px 34px rgba(13, 74, 31, 0.18);
            --surface: rgba(255,255,255,0.86);
            --radius-sm: 4px;
            --radius-md: 8px;
            --motion-fast: 160ms ease;
        }
        body {
            margin: 0; background: var(--bg); color: var(--ink);
            font-family: 'Montserrat', 'Noto Sans KR', sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100svh; width: 100vw; overflow: hidden; user-select: none; touch-action: manipulation;
            background:
                linear-gradient(45deg, rgba(9,201,93,0.045) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(9,201,93,0.045) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(9,201,93,0.045) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(9,201,93,0.045) 75%),
                var(--bg);
            background-position: 0 0, 0 12px, 12px -12px, -12px 0;
            background-size: 24px 24px;
        }
        /* 휴대폰 세로 화면에서는 가로 모드 전환을 안내한다. */
        #rotate-notice {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; text-align: center; padding: 28px; box-sizing: border-box;
        }
        @media (orientation: portrait) and (pointer: coarse) and (max-width: 760px) {
            #rotate-notice { display: flex; }
            #game-container { display: none; }
        }
        .phone-icon { width: 44px; height: 76px; border: 3px solid var(--ink); border-radius: 12px; animation: rotate 2s ease-in-out infinite; }
        .rotate-title { font-size: 22px; font-weight: 900; }
        .rotate-copy { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
        @keyframes rotate { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } }

        #game-container { --chrome-width: 1000px; position: relative; display: flex; flex-direction: column; align-items: center; width: min(96vw, 1000px); padding: 12px 0; }

        /* UI */
        #header { width: 250px; display: grid; grid-template-columns: repeat(2, 1fr); align-items: stretch; gap: 0; margin-bottom: 10px; overflow: hidden; box-sizing: border-box; background: var(--surface); border: 1px solid rgba(5,106,42,0.18); border-radius: var(--radius-md); box-shadow: 0 4px 0 rgba(5,106,42,0.08); }
        .stat { display: grid; grid-template-rows: auto auto; align-content: center; justify-items: center; min-height: 58px; min-width: 0; box-sizing: border-box; padding: 5px 9px; text-align: center; transition: background-color var(--motion-fast); }
        .stat + .stat { border-left: 1px solid rgba(5,106,42,0.16); }
        .stat.center, .stat.right { align-items: center; justify-self: auto; }
        .stat.warning { background: rgba(255,235,224,0.94); }
        .stat-label { font-size: 9px; color: var(--muted); letter-spacing: 0; }
        .stat.warning .stat-label { color: #9f3b22; }
        .stat-value { font-size: clamp(22px, 3vw, 32px); font-weight: 900; line-height: 1; color: var(--ink); }
        .stat.warning .stat-value { color: var(--apple); }

        #stage-wrap {
            --stage-pad-top: 28px;
            --stage-pad-x: 32px;
            --stage-pad-bottom: 36px;
            position: relative; background: linear-gradient(#24d977, var(--frame));
            border-radius: 22px; padding: var(--stage-pad-top) var(--stage-pad-x) var(--stage-pad-bottom);
            border: 1px solid rgba(0,95,38,0.24); box-shadow: var(--shadow);
            transition: filter 0.2s, box-shadow 0.2s; overflow: hidden;
        }
        #stage-wrap::after {
            content: ""; position: absolute; left: 52px; right: 52px; bottom: 13px; height: 10px;
            border-radius: 999px; background: rgba(255,255,255,0.36); box-shadow: inset 0 2px 2px rgba(255,255,255,0.35);
            pointer-events: none;
        }
        #stage-wrap.hit { animation: hit-pulse 0.28s ease-out; }
        #stage-wrap.miss { animation: miss-shake 0.18s ease-out; }
        canvas { display: block; border-radius: 3px; cursor: crosshair; width: min(100%, 900px); max-width: 100%; max-height: min(73svh, 620px); height: auto; touch-action: none; box-shadow: inset 0 0 0 2px rgba(0,120,50,0.18), 0 1px 0 rgba(255,255,255,0.45); }
        @keyframes hit-pulse { 0% { transform: scale(1); } 45% { transform: scale(1.008); } 100% { transform: scale(1); } }
        @keyframes miss-shake { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-4px); } 65% { transform: translateX(4px); } }

        /* 오버레이 */
        .overlay {
            position: absolute; top: var(--stage-pad-top); left: var(--stage-pad-x); right: var(--stage-pad-x); bottom: var(--stage-pad-bottom); width: auto; height: auto;
            background:
                linear-gradient(45deg, rgba(255,255,255,0.64) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.64) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.64) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.64) 75%),
                rgba(232, 255, 217, 0.96);
            background-position: 0 0, 0 16px, 16px -16px, -16px 0;
            background-size: 32px 32px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; border-radius: 3px; text-align: center; padding: 32px; box-sizing: border-box;
        }
        .hidden { display: none !important; }

        .start-layout { width: min(100%, 760px); display: grid; grid-template-columns: 210px minmax(320px, 380px); justify-content: center; align-items: start; gap: 32px; margin-top: 14px; }
        .brand { display: inline-grid; grid-template-columns: 64px auto; align-items: center; gap: 9px; margin-bottom: 10px; }
        .brand img { width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 4px 0 rgba(88,32,12,0.18)); }
        h1 { font-size: clamp(42px, 6vw, 72px); margin: 0; color: #35c83f; line-height: 0.9; text-shadow: -3px 0 #fff, 0 3px #fff, 3px 0 #fff, 0 -3px #fff, 0 6px 0 rgba(0,120,46,0.2); }
        .brand-kicker { display: block; color: var(--accent); font-size: 16px; line-height: 1; text-align: left; text-shadow: -2px 0 #fff, 0 2px #fff, 2px 0 #fff, 0 -2px #fff; }
        .tagline { margin: 0 0 10px; color: var(--ink); font-size: 13px; font-weight: 700; line-height: 1.45; }
        .start-actions { width: 210px; min-height: 222px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 12px; padding-top: 2px; box-sizing: border-box; }
        .apple-play {
            width: 146px; height: 118px; border: 0; padding: 0; margin: 0; background: transparent;
            position: relative; cursor: pointer; font-family: inherit; color: #fff; font-weight: 900; font-size: 30px;
            filter: drop-shadow(0 8px 0 rgba(126,43,22,0.18)); transition: transform var(--motion-fast), filter var(--motion-fast);
        }
        .apple-play img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
        .apple-play span { position: relative; z-index: 1; display: block; padding-top: 43px; text-shadow: 0 2px 0 rgba(90,20,8,0.28); }
        .apple-play:hover { transform: translateY(-2px); }
        .apple-play:active { transform: translateY(3px); filter: drop-shadow(0 4px 0 rgba(126,43,22,0.18)); }
        .mode-picker { width: 156px; display: flex; flex-direction: column; justify-content: center; gap: 7px; margin: 0; }
        .mode-btn { width: 100%; min-width: 0; min-height: 40px; padding: 8px 11px; border: 1px solid rgba(5,106,42,0.28); border-radius: var(--radius-sm); background: rgba(255,255,255,0.75); color: var(--muted); font-family: inherit; font-weight: 900; cursor: pointer; box-shadow: inset 0 -2px 0 rgba(5,106,42,0.08); transition: color var(--motion-fast), background-color var(--motion-fast), border-color var(--motion-fast), transform var(--motion-fast); }
        .mode-btn.active { border-color: var(--frame-dark); background: #fff; color: var(--frame-dark); box-shadow: inset 0 -2px 0 rgba(5,106,42,0.16); }
        .settings-row { width: min(100%, 380px); display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
        input { width: 100%; box-sizing: border-box; background: #fff; border: 2px solid var(--frame-dark); color: var(--ink); padding: 10px 12px; border-radius: 5px; font-size: 17px; text-align: center; outline: none; font-family: inherit; text-transform: uppercase; box-shadow: inset 0 2px 0 rgba(0,0,0,0.04); }
        input::placeholder { color: rgba(124,102,88,0.58); }
        input:focus { box-shadow: 0 0 0 3px rgba(255,138,28,0.24); border-color: var(--accent); }
        button:focus-visible, input:focus-visible { outline: 3px solid rgba(36,119,255,0.5); outline-offset: 3px; }
        .overlay:focus { outline: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
        input, button, #rank-container, .overlay { touch-action: manipulation; }
        .nick-help, .result-detail { color: var(--muted); font-size: 12px; min-height: 18px; margin-bottom: 2px; }
        .result-detail { color: var(--ink); }
        .save-state {
            display: inline-flex; align-items: center; justify-content: center; min-height: 26px; margin-bottom: 8px;
            padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,0.74); border: 1px solid var(--line);
            color: var(--muted); font-size: 12px; font-weight: 900; box-sizing: border-box;
        }
        .save-state:empty { visibility: hidden; }
        .save-state.local { background: rgba(244,182,58,0.18); border-color: rgba(244,182,58,0.45); color: #8b6412; }
        .save-state.online { background: rgba(9,201,93,0.14); border-color: rgba(5,169,77,0.45); color: var(--frame-dark); }
        .save-state.saving { background: rgba(36,119,255,0.12); border-color: rgba(36,119,255,0.42); color: #2254a7; }
        .save-state.blocked { background: rgba(255,63,31,0.12); border-color: rgba(255,63,31,0.34); color: #b83b20; }
        .challenge-banner { width: min(86%, 430px); margin: 0 0 10px; padding: 10px 12px; border-radius: var(--radius-md); background: rgba(244,182,58,0.18); border: 1px solid rgba(244,182,58,0.46); color: var(--ink); font-size: 12px; line-height: 1.45; }
        .challenge-banner strong { color: var(--gold); }
        .result-title { margin: 0 0 12px; font-size: clamp(36px, 6vw, 60px); }
        .result-card { width: min(88%, 460px); padding: 18px; border-radius: var(--radius-md); background: #fff; border: 2px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,0.6); margin-bottom: 12px; }
        .result-label { color: var(--muted); font-size: 11px; letter-spacing: 0; }
        #res-score { font-size: clamp(42px, 8vw, 68px); line-height: 1; margin: 8px 0 12px; color: var(--apple); text-shadow: 0 3px 0 rgba(244,182,58,0.24); }
        .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
        .result-chip { border-radius: 8px; background: rgba(47,157,103,0.08); padding: 9px 7px; }
        .result-chip span { display: block; color: var(--muted); font-size: 9px; }
        .result-chip strong { display: block; margin-top: 3px; font-size: 14px; color: var(--ink); }
        
        .btn { padding: 10px 26px; font-size: 17px; font-weight: 900; background: linear-gradient(#ff6a45, var(--apple)); color: white; border: 1px solid rgba(122,39,28,0.25); border-radius: 5px; cursor: pointer; margin: 4px; font-family: inherit; transition: transform 0.15s, filter 0.15s; box-shadow: 0 5px 0 rgba(122, 39, 28, 0.24); }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
        .btn.share { background: #fff; border-color: rgba(5,169,77,0.62); color: var(--frame-dark); box-shadow: 0 5px 0 rgba(34,104,67,0.14); }
        .result-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .result-actions .btn { min-width: 154px; margin: 0; }

        /* 랭킹 리스트 */
        #rank-container { width: 100%; max-height: min(34svh, 214px); overflow-y: auto; background: rgba(255,255,255,0.84); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font-size: 13px; box-sizing: border-box; }
        .rank-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .rank-title { color: var(--frame-dark); font-size: 12px; }
        .rank-tabs { display: flex; gap: 5px; }
        .rank-tab { min-height: 32px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--muted); padding: 5px 10px; font: inherit; font-size: 10px; cursor: pointer; transition: color var(--motion-fast), background-color var(--motion-fast), border-color var(--motion-fast); }
        .rank-tab.active { background: rgba(36,119,255,0.12); border-color: rgba(36,119,255,0.62); color: var(--ink); }
        .rank-meta { color: var(--muted); font-size: 10px; line-height: 1.4; margin: 0 0 6px; text-align: left; }
        .my-rank { display: grid; grid-template-columns: 54px 1fr auto; gap: 8px; align-items: center; color: #9b6812; background: rgba(244,182,58,0.16); border: 1px solid rgba(244,182,58,0.34); border-radius: 8px; padding: 7px 8px; margin-bottom: 7px; }
        .rank-item { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; padding: 6px 2px; border-bottom: 1px solid var(--line); }
        .rank-item:last-child { border-bottom: 0; }
        .rank-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
        .rank-score { color: var(--ink); }
        .rank-item.me { color: var(--accent); font-weight: bold; background: rgba(36,119,255,0.08); border-radius: 8px; padding-left: 6px; padding-right: 6px; }
        .rank-empty { min-height: 46px; display: grid; place-items: center; color: var(--muted); padding: 12px 0; box-sizing: border-box; }
        #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 18px); z-index: 10000; min-width: min(88vw, 320px); max-width: 90vw; padding: 12px 16px; border-radius: 999px; background: rgba(47, 157, 103, 0.94); color: #fff; font-size: 13px; font-weight: 900; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.18s, transform 0.18s; box-shadow: 0 14px 34px rgba(34,104,67,0.22); }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }

        @media (min-width: 1100px) and (pointer: fine) {
            body { align-items: center; }
            #game-container { width: min(94vw, 1000px); padding: 16px 0; }
            #header { width: 280px; margin-bottom: 10px; }
            .stat { min-height: 62px; }
            .stat-label { font-size: 11px; }
            .stat-value { font-size: clamp(32px, 3vw, 44px); }
            #stage-wrap { border-radius: 20px; }
            .overlay { padding: 32px; }
            h1 { font-size: clamp(54px, 4.8vw, 76px); margin-bottom: 8px; }
            .tagline { font-size: 15px; margin-bottom: 14px; }
            .start-layout { grid-template-columns: 220px minmax(340px, 390px); gap: 34px; }
            .start-actions { width: 220px; }
            .mode-picker { width: 164px; gap: 8px; margin-bottom: 0; }
            .mode-btn { min-width: 0; padding: 10px 14px; font-size: 14px; }
            input { padding: 14px 16px; font-size: 20px; }
            #rank-container { width: 100%; max-height: min(30svh, 260px); padding: 12px; }
            .rank-title { font-size: 13px; }
            .rank-tab { font-size: 11px; padding: 6px 10px; }
            .rank-meta { font-size: 11px; }
            .btn { padding: 12px 34px; font-size: 19px; }
            .result-actions .btn { min-width: 176px; }
            .result-card { width: min(60%, 580px); padding: 22px; }
        }
        @media (orientation: landscape) and (pointer: coarse) {
            body { align-items: flex-start; min-height: 100dvh; }
            #game-container { width: 100vw; max-width: none; padding: 6px 8px 0; box-sizing: border-box; }
            #header { width: 160px; margin-bottom: 4px; }
            .stat { min-height: 43px; min-width: 0; padding: 3px 7px; }
            .stat-label { font-size: 8px; }
            .stat-value { font-size: clamp(24px, 9dvh, 42px); }
            #stage-wrap { --stage-pad-top: 4px; --stage-pad-x: 4px; --stage-pad-bottom: 18px; border-radius: 12px; }
            canvas { max-width: none; max-height: none; border-radius: 9px; }
            .overlay { padding: 12px; }
            h1 { font-size: clamp(30px, 8dvh, 48px); }
            .brand { grid-template-columns: 46px auto; margin-bottom: 8px; }
            .brand img { width: 46px; height: 46px; }
            .brand-kicker { font-size: 11px; }
            .start-layout { grid-template-columns: 136px minmax(220px, 312px); align-items: center; gap: 12px; margin-top: 6px; }
            .start-actions { width: 136px; min-height: 132px; gap: 8px; padding-top: 0; }
            .apple-play { width: 108px; height: 90px; font-size: 22px; }
            .apple-play span { padding-top: 31px; }
            .tagline { margin-bottom: 10px; font-size: 11px; }
            .mode-picker { width: 130px; gap: 6px; margin-bottom: 0; }
            .mode-btn { min-width: 0; min-height: 34px; padding: 7px 8px; font-size: 11px; }
            .settings-row { width: min(48vw, 312px); gap: 6px; }
            input { margin-bottom: 0; padding: 9px 11px; font-size: 15px; }
            .nick-help { min-height: 14px; margin-bottom: 0; font-size: 10px; }
            #rank-container { max-height: 29dvh; margin-bottom: 0; padding: 8px; }
            .rank-meta { font-size: 9px; }
            .challenge-banner { margin-bottom: 8px; padding: 8px 10px; font-size: 10px; }
            #screen-result { justify-content: flex-start; overflow-y: auto; padding: 8px 12px 10px; }
            .result-title { margin: 0 0 4px; font-size: 30px; line-height: 0.95; }
            .result-card { width: min(90%, 460px); padding: 8px 10px; margin-bottom: 5px; }
            #res-score { font-size: 38px; margin: 4px 0 5px; }
            .result-detail { min-height: 14px; margin-bottom: 0; font-size: 10px; }
            .result-grid { gap: 6px; margin-top: 5px; }
            .result-chip { padding: 4px 5px; }
            .result-chip strong { font-size: 11px; }
            .save-state { min-height: 22px; margin-bottom: 5px; padding: 3px 10px; font-size: 10px; }
            .result-actions { gap: 8px; }
            .result-actions .btn { min-width: 142px; }
            .btn { padding: 7px 18px; font-size: 14px; }
        }
        @media (max-width: 720px) {
            body { align-items: flex-start; }
            #game-container { width: 98vw; padding-top: 72px; }
            #header { padding: 0 8px; box-sizing: border-box; }
            .stat { min-width: 70px; }
            .overlay { justify-content: flex-start; padding-top: 24px; overflow-y: auto; }
            h1 { font-size: 34px; }
            .brand { grid-template-columns: 44px auto; }
            .brand img { width: 44px; height: 44px; }
            .brand-kicker { font-size: 10px; }
            .start-layout { width: min(100%, 360px); grid-template-columns: 1fr; gap: 12px; margin-top: 10px; }
            .start-actions { min-height: 0; }
            .mode-picker { width: min(100%, 180px); }
            .settings-row { width: min(92vw, 360px); }
            #rank-container { width: 100%; }
            .result-actions .btn { width: min(100%, 220px); }
        }
        @media (orientation: portrait) and (max-width: 720px) {
            .overlay { position: fixed; top: 52px; left: 10px; right: 10px; bottom: 16px; width: auto; height: auto; }
        }
        @media (orientation: portrait) and (pointer: coarse) and (max-width: 760px) {
            #rotate-notice { display: flex; }
            #game-container { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>

<div id="rotate-notice" role="status" aria-live="polite">
    <div class="phone-icon"></div>
    <div class="rotate-title">가로 모드로 플레이해주세요</div>
    <p class="rotate-copy">사과를 더 정확하게 고르려면 휴대폰을 옆으로 돌려주세요.</p>
</div>

<main id="game-container">
    <header id="header" aria-label="게임 현황">
        <div class="stat time-stat"><div class="stat-label">시간</div><div id="v-time" class="stat-value">120</div></div>
        <div class="stat right"><div class="stat-label">점수</div><div id="v-score" class="stat-value">0</div></div>
    </header>

    <div id="stage-wrap">
        <canvas id="stage"></canvas>

        <div id="screen-start" class="overlay">
            <div class="brand" aria-label="사과 팡팡">
                <img src="assets/apple-mascot.png" alt="" aria-hidden="true">
                <div>
                    <span class="brand-kicker">온라인 레트로 퍼즐</span>
                    <h1>사과 팡팡</h1>
                </div>
            </div>
            <p class="tagline">합계 10을 만들면 선택한 사과가 1개당 1점씩 올라요.</p>
            <div id="challenge-banner" class="challenge-banner hidden"></div>

            <div class="start-layout">
                <div class="start-actions">
                    <button type="button" class="apple-play" onclick="Game.start()" aria-label="게임 시작">
                        <img src="assets/apple-mascot.png" alt="" aria-hidden="true">
                        <span>시작</span>
                    </button>
                    <div class="mode-picker" role="group" aria-label="게임 모드">
                        <button type="button" id="mode-classic" class="mode-btn" aria-pressed="true" onclick="Game.setMode('classic')">120초 클래식</button>
                        <button type="button" id="mode-rush" class="mode-btn" aria-pressed="false" onclick="Game.setMode('rush')">60초 스피드</button>
                    </div>
                </div>

                <div class="settings-row">
                    <label class="sr-only" for="nick-input">닉네임</label>
                    <input type="text" id="nick-input" placeholder="닉네임" maxlength="12" autocomplete="off" spellcheck="false" aria-describedby="nick-help">
                    <div id="nick-help" class="nick-help"></div>
                    <div id="rank-container">
                        <div class="rank-head">
                            <div class="rank-title">온라인 TOP 10</div>
                            <div class="rank-tabs" role="group" aria-label="랭킹 범위">
                                <button type="button" id="rank-all" class="rank-tab active" aria-pressed="true" onclick="Game.setRankMode('all')">전체</button>
                                <button type="button" id="rank-today" class="rank-tab" aria-pressed="false" onclick="Game.setRankMode('today')">오늘</button>
                            </div>
                        </div>
                        <p id="rank-meta" class="rank-meta">닉네임별 최고점만 저장됩니다.</p>
                        <div id="my-rank" class="my-rank hidden"></div>
                        <div id="rank-list" aria-live="polite">로딩 중...</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="screen-result" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="res-title" tabindex="-1">
            <h1 id="res-title" class="result-title">시간 끝!</h1>
            <div class="result-card">
                <div class="result-label">최종 점수</div>
                <div id="res-score">0</div>
                <div id="res-detail" class="result-detail"></div>
                <div class="result-grid">
                    <div class="result-chip"><span>모드</span><strong id="res-mode">-</strong></div>
                    <div class="result-chip"><span>플레이 시간</span><strong id="res-time">-</strong></div>
                    <div class="result-chip"><span>터뜨린 사과</span><strong id="res-apples">0</strong></div>
                </div>
            </div>
            <div id="save-state" class="save-state" role="status" aria-live="polite"></div>
            <div class="result-actions">
                <button type="button" class="btn share" onclick="Game.share()">친구에게 도전장</button>
                <button type="button" class="btn" onclick="Game.start()">다시 하기</button>
            </div>
        </div>
    </div>

</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const firebaseConfig = window.APPLE_BURST_FIREBASE_CONFIG || null;
const db = (() => {
    if(!firebaseConfig || !firebaseConfig.apiKey || !firebaseConfig.databaseURL) return null;
    try {
        firebase.initializeApp(firebaseConfig);
        return firebase.database();
    } catch (error) {
        console.warn(error);
        return null;
    }
})();

const ROWS = 10, COLS = 17, CELL = 52, PAD = 25, DEFAULT_TIME = 120, MAX_NICK = 12, LOW_APPLE_LIMIT = 18;
const DEFAULT_NICK = "플레이어";
const { SCORE_VERSION, scoreForApples } = window.AppleBurstRules;
const MAX_RANK_SCORE = 999999, SAVE_COOLDOWN_MS = 8000;
const TUTORIAL_KEY = `apple_tutorial_seen_v${SCORE_VERSION}`;
const dpr = window.devicePixelRatio || 1;

const Game = {
    canvas: document.getElementById('stage'),
    ctx: document.getElementById('stage').getContext('2d'),
    active: false, dragging: false,
    score: 0, time: DEFAULT_TIME, mode: "classic", modeTime: DEFAULT_TIME,
    cleared: 0, reshuffles: 0,
    playStartedAt: 0, scoreSaved: false,
    nick: DEFAULT_NICK, playerKey: "player", latestRanks: [], rankMode: "all", rankFallbackActive: false, composingNick: false,
    grid: [], effects: [], particles: [],
    tutorialHint: null, audioCtx: null, audioEnabled: false,
    toastTimer: null,
    pointerType: "mouse",
    mStart: {x:0, y:0}, mCurrent: {x:0, y:0},

    init() {
        this.canvas.width = (COLS * CELL + PAD * 2) * dpr;
        this.canvas.height = (ROWS * CELL + PAD * 2) * dpr;
        this.ctx.scale(dpr, dpr);
        this.nick = this.cleanNick(localStorage.getItem('apple_nick') || "") || DEFAULT_NICK;
        this.playerKey = this.getPlayerKey(this.nick);
        const nickInput = document.getElementById('nick-input');
        nickInput.value = this.nick === DEFAULT_NICK || this.nick === "PLAYER" ? "" : this.nick;
        this.setMode(localStorage.getItem('apple_mode') || "classic");
        this.loadChallenge();
        this.updateHud();
        this.watchRanks();
        this.bindEvents();
        this.layout();
        this.loop();
    },

    bindEvents() {
        const nickInput = document.getElementById('nick-input');
        nickInput.addEventListener('compositionstart', () => {
            this.composingNick = true;
            this.setNickHelp("");
        });
        nickInput.addEventListener('compositionend', () => {
            this.composingNick = false;
            this.syncNickInput(nickInput);
        });
        nickInput.addEventListener('input', (e) => {
            if(this.composingNick || e.isComposing) return;
            this.syncNickInput(nickInput);
        });
        nickInput.addEventListener('keydown', (e) => {
            if(e.key === "Enter") this.start();
        });
        window.addEventListener('resize', () => this.layout());
        window.visualViewport?.addEventListener('resize', () => this.layout());
        window.addEventListener('orientationchange', () => setTimeout(() => this.layout(), 250));

        const getPos = (e) => {
            const r = this.canvas.getBoundingClientRect();
            return {
                x: (e.clientX - r.left) * (this.canvas.width / dpr / r.width),
                y: (e.clientY - r.top) * (this.canvas.height / dpr / r.height)
            };
        };
        this.canvas.addEventListener('pointerdown', (e) => {
            if(!this.active) return;
            e.preventDefault();
            this.clearTutorialHint();
            this.dragging = true;
            this.pointerType = e.pointerType || "mouse";
            this.canvas.setPointerCapture?.(e.pointerId);
            this.mStart = getPos(e);
            this.mCurrent = {...this.mStart};
        });
        this.canvas.addEventListener('pointermove', (e) => {
            if(!this.dragging) return;
            e.preventDefault();
            this.mCurrent = getPos(e);
        });
        const endDrag = (e) => {
            if(!this.dragging) return;
            e?.preventDefault?.();
            this.dragging = false;
            if(e?.pointerId !== undefined) this.canvas.releasePointerCapture?.(e.pointerId);
            this.check();
        };
        this.canvas.addEventListener('pointerup', endDrag);
        this.canvas.addEventListener('pointercancel', endDrag);
        this.canvas.addEventListener('lostpointercapture', () => {
            if(this.dragging) {
                this.dragging = false;
                this.check();
            }
        });
    },

    cleanNick(value) {
        return String(value || "")
            .normalize("NFKC")
            .replace(/[^\p{L}\p{N}_ -]/gu, "")
            .replace(/\s+/g, " ")
            .trim()
            .slice(0, MAX_NICK)
            .toUpperCase();
    },

    getPlayerKey(nick) {
        return encodeURIComponent(this.cleanNick(nick).toLowerCase() || "player").slice(0, 90);
    },

    getRankKey(mode = this.mode) {
        return `v${SCORE_VERSION}_${mode}_${this.playerKey}`;
    },

    getModeFromRankKey(key = "") {
        if(String(key).startsWith(`v${SCORE_VERSION}_rush_`)) return "rush";
        if(String(key).startsWith("rush_")) return "rush";
        return "classic";
    },

    getModeLabel(mode = this.mode) {
        return mode === "rush" ? "60초 스피드" : "120초 클래식";
    },

    getBestKey(mode = this.mode) {
        return `apple_best_v${SCORE_VERSION}_${mode}`;
    },

    getLocalBest(mode = this.mode) {
        return Number(localStorage.getItem(this.getBestKey(mode)) || 0);
    },

    setLocalBest(score, mode = this.mode) {
        localStorage.setItem(this.getBestKey(mode), score);
    },

    getSaveCooldownKey(mode = this.mode) {
        return `apple_last_save_v${SCORE_VERSION}_${mode}`;
    },

    validateRankSave() {
        if(!Number.isFinite(this.score) || this.score <= 0 || this.score > MAX_RANK_SCORE) {
            return this.score <= 0 ? "NO_SCORE" : "BAD_SCORE";
        }
        const elapsed = Date.now() - this.playStartedAt;
        const minElapsed = Math.max(45000, this.modeTime * 1000 - 2500);
        if(!this.playStartedAt || elapsed < minElapsed) return "TOO_FAST";
        const lastSave = Number(localStorage.getItem(this.getSaveCooldownKey()) || 0);
        if(Date.now() - lastSave < SAVE_COOLDOWN_MS) return "COOLDOWN";
        return "OK";
    },

    buildShareUrl() {
        const url = new URL(window.location.href);
        url.searchParams.set('challenge', '1');
        url.searchParams.set('mode', this.mode);
        url.searchParams.set('score', Math.max(0, Math.round(this.score)));
        url.searchParams.set('nick', this.nick);
        return url.toString();
    },

    escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
        }[char]));
    },

    setNickHelp(message) {
        document.getElementById('nick-help').innerText = message;
    },

    setSaveState(message, tone = "") {
        const state = document.getElementById('save-state');
        if(!state) return;
        state.className = `save-state ${tone}`.trim();
        state.innerText = message;
    },

    loadChallenge() {
        const params = new URLSearchParams(window.location.search);
        if(params.get('challenge') !== '1') return;
        const mode = params.get('mode') === "rush" ? "rush" : "classic";
        const score = Math.max(0, Math.min(999999, Math.round(Number(params.get('score')) || 0)));
        const nick = this.cleanNick(params.get('nick') || "친구") || "친구";
        if(!score) return;
        this.setMode(mode);
        const banner = document.getElementById('challenge-banner');
        banner.classList.remove('hidden');
        banner.innerHTML = `<strong>${this.escapeHTML(nick)}</strong>님의 ${this.getModeLabel(mode)} 기록 <strong>${score.toLocaleString()}점</strong>에 도전해봐요!`;
    },

    setMode(mode) {
        this.mode = mode === "rush" ? "rush" : "classic";
        this.modeTime = this.mode === "rush" ? 60 : 120;
        this.time = this.active ? this.time : this.modeTime;
        localStorage.setItem('apple_mode', this.mode);
        const rushButton = document.getElementById('mode-rush');
        const classicButton = document.getElementById('mode-classic');
        rushButton?.classList.toggle('active', this.mode === "rush");
        classicButton?.classList.toggle('active', this.mode === "classic");
        rushButton?.setAttribute('aria-pressed', String(this.mode === "rush"));
        classicButton?.setAttribute('aria-pressed', String(this.mode === "classic"));
        this.updateHud();
        this.renderRanks(this.latestRanks);
    },

    setRankMode(mode) {
        this.rankMode = mode === "today" ? "today" : "all";
        const allButton = document.getElementById('rank-all');
        const todayButton = document.getElementById('rank-today');
        allButton?.classList.toggle('active', this.rankMode === "all");
        todayButton?.classList.toggle('active', this.rankMode === "today");
        allButton?.setAttribute('aria-pressed', String(this.rankMode === "all"));
        todayButton?.setAttribute('aria-pressed', String(this.rankMode === "today"));
        this.renderRanks(this.latestRanks);
    },

    todayRange() {
        const start = new Date();
        start.setHours(0, 0, 0, 0);
        const end = new Date(start);
        end.setDate(end.getDate() + 1);
        return { start: start.getTime(), end: end.getTime(), label: start.toLocaleDateString('ko-KR') };
    },

    showToast(message) {
        const toast = document.getElementById('toast');
        if(!toast) return;
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => toast.classList.remove('show'), 2100);
    },

    isMobileLandscape() {
        return window.matchMedia('(orientation: landscape) and (pointer: coarse)').matches;
    },

    isDesktopWide() {
        return window.matchMedia('(min-width: 900px) and (pointer: fine)').matches;
    },

    syncChromeWidth(canvasWidth = null) {
        const container = document.getElementById('game-container');
        const wrap = document.getElementById('stage-wrap');
        if(!container || !wrap) return;
        const style = getComputedStyle(wrap);
        const px = (value) => Number.parseFloat(value) || 0;
        const frameX = px(style.paddingLeft) + px(style.paddingRight) + px(style.borderLeftWidth) + px(style.borderRightWidth);
        const measuredCanvasWidth = canvasWidth || this.canvas.getBoundingClientRect().width;
        const width = Math.ceil(measuredCanvasWidth + frameX);
        if(width > 0) container.style.setProperty('--chrome-width', `${width}px`);
    },

    layout() {
        const baseW = COLS * CELL + PAD * 2;
        const baseH = ROWS * CELL + PAD * 2;
        if(!this.isMobileLandscape()) {
            if(this.isDesktopWide()) {
                const viewport = window.visualViewport || { width: window.innerWidth, height: window.innerHeight };
                const header = document.getElementById('header');
                const headerH = header ? header.offsetHeight : 54;
                const availableW = Math.max(760, Math.min(1220, viewport.width - 80));
                const availableH = Math.max(460, viewport.height - headerH - 112);
                const scale = Math.min(availableW / baseW, availableH / baseH, 1);
                const canvasW = Math.floor(baseW * scale);
                this.canvas.style.width = `${canvasW}px`;
                this.canvas.style.maxHeight = "none";
                this.syncChromeWidth(canvasW);
                return;
            }
            this.canvas.style.width = "";
            this.canvas.style.maxHeight = "";
            requestAnimationFrame(() => this.syncChromeWidth());
            return;
        }
        const viewport = window.visualViewport || { width: window.innerWidth, height: window.innerHeight };
        const header = document.getElementById('header');
        const headerH = header ? header.offsetHeight : 54;
        const availableW = Math.max(360, viewport.width - 16);
        const availableH = Math.max(240, viewport.height - headerH - 24);
        const scale = Math.min(availableW / baseW, availableH / baseH);
        const canvasW = Math.floor(baseW * scale);
        this.canvas.style.width = `${canvasW}px`;
        this.canvas.style.maxHeight = "none";
        this.syncChromeWidth(canvasW);
    },

    enterFullscreen() {
        if(!this.isMobileLandscape() || document.fullscreenElement || document.webkitFullscreenElement) return;
        const el = document.documentElement;
        const request = el.requestFullscreen || el.webkitRequestFullscreen;
        if(!request) {
            this.layout();
            return;
        }
        try {
            const result = request.call(el, { navigationUI: "hide" });
            if(result && typeof result.then === "function") {
                result.then(() => setTimeout(() => this.layout(), 250)).catch(() => this.layout());
            } else {
                setTimeout(() => this.layout(), 250);
            }
        } catch(error) {
            this.layout();
        }
    },

    haptic(type) {
        if(!navigator.vibrate) return;
        if(type === "hit") navigator.vibrate([18]);
        if(type === "miss") navigator.vibrate([8]);
    },

    primeAudio() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if(!AudioContext) return;
        if(!this.audioCtx) this.audioCtx = new AudioContext();
        if(this.audioCtx.state === "suspended") this.audioCtx.resume().catch(() => {});
        this.audioEnabled = true;
    },

    playSound(type) {
        if(!this.audioEnabled || !this.audioCtx || this.audioCtx.state !== "running") return;
        const ctx = this.audioCtx;
        const now = ctx.currentTime;
        const gain = ctx.createGain();
        const osc = ctx.createOscillator();
        const toneMap = {
            hit: { from: 520, to: 760, duration: 0.11, volume: 0.04, wave: "triangle" },
            miss: { from: 180, to: 120, duration: 0.12, volume: 0.028, wave: "sine" },
        };
        const tone = toneMap[type] || toneMap.hit;
        osc.type = tone.wave;
        osc.frequency.setValueAtTime(tone.from, now);
        osc.frequency.exponentialRampToValueAtTime(tone.to, now + tone.duration);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(tone.volume, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + tone.duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + tone.duration + 0.02);
    },

    makeApple() {
        return { val: Math.floor(Math.random() * 9) + 1, scale: 0, removed: false };
    },

    newBoard() {
        return Array.from({length: ROWS}, () => Array.from({length: COLS}, () => this.makeApple()));
    },

    buildPlayableBoard() {
        let guard = 0;
        do {
            this.grid = this.newBoard();
            guard++;
        } while(!this.hasAnyTen() && guard < 20);
    },

    activeCount() {
        let count = 0;
        for(let r = 0; r < ROWS; r++) {
            for(let c = 0; c < COLS; c++) {
                if(this.grid[r]?.[c] && !this.grid[r][c].removed) count++;
            }
        }
        return count;
    },

    findTenSelection() {
        if(!this.grid.length) return null;
        const sums = Array.from({length: ROWS + 1}, () => Array(COLS + 1).fill(0));
        for(let r = 0; r < ROWS; r++) {
            for(let c = 0; c < COLS; c++) {
                const apple = this.grid[r]?.[c];
                const value = apple && !apple.removed ? apple.val : 0;
                sums[r + 1][c + 1] = value + sums[r][c + 1] + sums[r + 1][c] - sums[r][c];
            }
        }
        for(let r1 = 0; r1 < ROWS; r1++) {
            for(let c1 = 0; c1 < COLS; c1++) {
                for(let r2 = r1; r2 < ROWS; r2++) {
                    for(let c2 = c1; c2 < COLS; c2++) {
                        const sum = sums[r2 + 1][c2 + 1] - sums[r1][c2 + 1] - sums[r2 + 1][c1] + sums[r1][c1];
                        if(sum === 10) {
                            const items = [];
                            for(let r = r1; r <= r2; r++) {
                                for(let c = c1; c <= c2; c++) {
                                    if(this.grid[r]?.[c] && !this.grid[r][c].removed) items.push({r, c});
                                }
                            }
                            return {
                                items,
                                rect: {
                                    x: PAD + c1 * CELL,
                                    y: PAD + r1 * CELL,
                                    w: (c2 - c1 + 1) * CELL,
                                    h: (r2 - r1 + 1) * CELL,
                                },
                                center: {
                                    x: PAD + (c1 + c2 + 1) * CELL / 2,
                                    y: PAD + (r1 + r2 + 1) * CELL / 2,
                                },
                            };
                        }
                    }
                }
            }
        }
        return null;
    },

    hasAnyTen() {
        return !!this.findTenSelection();
    },

    maybeShowTutorialHint() {
        if(localStorage.getItem(TUTORIAL_KEY) === "1") {
            this.tutorialHint = null;
            return;
        }
        const hint = this.findTenSelection();
        if(!hint) return;
        this.tutorialHint = { ...hint, startedAt: performance.now(), duration: 3000 };
        localStorage.setItem(TUTORIAL_KEY, "1");
    },

    clearTutorialHint() {
        this.tutorialHint = null;
    },

    refreshBoard(message) {
        this.buildPlayableBoard();
        this.reshuffles++;
        const centerX = (COLS * CELL + PAD * 2) / 2;
        const centerY = (ROWS * CELL + PAD * 2) / 2;
        this.spawnEffect(message, centerX, centerY, '#f4b63a');
        this.spawnBurst(centerX, centerY);
        this.flashBoard('hit');
        this.haptic("hit");
    },

    ensureBoard() {
        if(!this.active) return;
        const remaining = this.activeCount();
        if(remaining <= LOW_APPLE_LIMIT) {
            this.refreshBoard("다시 섞기");
        } else if(!this.hasAnyTen()) {
            this.refreshBoard("새 조합");
        }
    },

    syncNickInput(nickInput) {
        const before = nickInput.value;
        const clean = this.cleanNick(before);
        if(before !== clean) {
            nickInput.value = clean;
            this.setNickHelp("사용할 수 없는 문자는 제거했어요.");
        } else {
            this.setNickHelp("");
        }
        this.nick = clean || DEFAULT_NICK;
        this.playerKey = this.getPlayerKey(this.nick);
        this.renderRanks(this.latestRanks);
    },

    watchRanks() {
        const list = document.getElementById('rank-list');
        if(!db) {
            this.renderRanks([]);
            return;
        }
        db.ref('ranks').orderByChild('score').on('value', (snapshot) => {
            const rows = this.rowsFromSnapshot(snapshot);
            this.latestRanks = rows;
            this.renderRanks(rows);
        }, (error) => {
            console.warn(error);
            if(this.rankFallbackActive) return;
            this.rankFallbackActive = true;
            db.ref('ranks').on('value', (snapshot) => {
                const rows = this.rowsFromSnapshot(snapshot);
                this.latestRanks = rows;
                this.renderRanks(rows);
            }, () => {
                list.innerHTML = `<div class="rank-empty">랭킹을 불러오지 못했습니다.</div>`;
            });
        });
    },

    rowsFromSnapshot(snapshot) {
        const rows = [];
        snapshot.forEach((child) => {
            const data = child.val() || {};
            const score = Number(data.score);
            if(!Number.isFinite(score) || score <= 0) return;
            const version = Number(data.version) || (String(child.key).startsWith(`v${SCORE_VERSION}_`) ? SCORE_VERSION : 1);
            if(version !== SCORE_VERSION) return;
            rows.push({
                key: child.key,
                mode: this.getModeFromRankKey(child.key),
                nick: this.cleanNick(data.nick) || DEFAULT_NICK,
                score: Math.max(0, Math.round(score)),
                updatedAt: Number(data.updatedAt) || 0,
            });
        });
        rows.sort((a, b) => b.score - a.score);
        return rows;
    },

    renderRanks(rows = []) {
        const list = document.getElementById('rank-list');
        const meta = document.getElementById('rank-meta');
        const myRankBox = document.getElementById('my-rank');
        const myBest = this.getLocalBest();
        const { start, end, label } = this.todayRange();
        const modeRows = rows
            .filter(row => row.mode === this.mode)
            .slice()
            .sort((a, b) => b.score - a.score);
        const scopedRows = (this.rankMode === "today"
            ? modeRows.filter(row => row.updatedAt >= start && row.updatedAt < end)
            : modeRows
        ).slice().sort((a, b) => b.score - a.score);
        const topRows = scopedRows.slice(0, 10);
        const rankKey = this.getRankKey();
        const myIndex = scopedRows.findIndex(row => row.key === rankKey || row.nick === this.nick);
        const myRow = myIndex >= 0 ? scopedRows[myIndex] : null;
        const modeLabel = this.getModeLabel();

        meta.innerText = this.rankMode === "today"
            ? `${label} ${modeLabel} · 오늘 갱신된 최고점`
            : `${modeLabel} 전체 랭킹 · 닉네임별 최고점 · 총 ${modeRows.length.toLocaleString()}명`;

        if(myRow) {
            myRankBox.classList.remove('hidden');
            myRankBox.innerHTML = `
                <span>#${myIndex + 1}</span>
                <span class="rank-name">내 순위</span>
                <span class="rank-score">${myRow.score.toLocaleString()}</span>
            `;
        } else if(myBest) {
            myRankBox.classList.remove('hidden');
            myRankBox.innerHTML = `
                <span>#-</span>
                <span class="rank-name">내 최고점</span>
                <span class="rank-score">${myBest.toLocaleString()}</span>
            `;
        } else {
            myRankBox.classList.add('hidden');
            myRankBox.innerHTML = "";
        }

        if(!topRows.length) {
            list.innerHTML = myBest
                ? `<div class="rank-empty">아직 이 탭에 랭킹이 없습니다.</div>`
                : `<div class="rank-empty">아직 랭킹이 없습니다.</div>`;
            return;
        }
        list.innerHTML = topRows.map((row, index) => {
            const isMe = row.key === rankKey || row.nick === this.nick;
            return `
                <div class="rank-item ${isMe ? "me" : ""}">
                    <span>#${index + 1}</span>
                    <span class="rank-name">${this.escapeHTML(row.nick)}</span>
                    <span class="rank-score">${row.score.toLocaleString()}</span>
                </div>
            `;
        }).join("");
    },

    start() {
        this.primeAudio();
        this.enterFullscreen();
        const nickInput = document.getElementById('nick-input');
        this.nick = this.cleanNick(nickInput.value) || DEFAULT_NICK;
        this.playerKey = this.getPlayerKey(this.nick);
        nickInput.value = this.nick === DEFAULT_NICK ? "" : this.nick;
        localStorage.setItem('apple_nick', this.nick);
        this.buildPlayableBoard();
        this.score = 0; this.time = this.modeTime; this.cleared = 0; this.reshuffles = 0; this.effects = []; this.particles = []; this.active = true;
        this.maybeShowTutorialHint();
        this.playStartedAt = Date.now();
        this.scoreSaved = false;
        this.setNickHelp("");
        this.setSaveState("");
        document.getElementById('screen-start').classList.add('hidden');
        document.getElementById('screen-result').classList.add('hidden');
        this.updateHud();
        this.layout();
        if(this.timer) clearInterval(this.timer);
        this.timer = setInterval(() => {
            this.time--;
            this.updateHud();
            if(this.time <= 0) this.end();
        }, 1000);
    },

    end() {
        this.active = false; clearInterval(this.timer);
        this.updateHud();
        const myBest = this.getLocalBest();
        const isNewBest = this.validateRankSave() === "OK" && this.score > myBest;
        if(isNewBest) this.setLocalBest(this.score);

        document.getElementById('res-title').innerText = isNewBest ? "새 기록!" : "시간 끝!";
        document.getElementById('res-score').innerText = this.score.toLocaleString();
        const modeLabel = this.getModeLabel();
        document.getElementById('res-detail').innerText = `${this.nick} · 최고 ${Math.max(myBest, this.score).toLocaleString()}점`;
        document.getElementById('res-mode').innerText = modeLabel;
        document.getElementById('res-time').innerText = `${this.modeTime}초`;
        document.getElementById('res-apples').innerText = this.cleared.toLocaleString();
        this.saveScore();
        const resultScreen = document.getElementById('screen-result');
        resultScreen.classList.remove('hidden');
        requestAnimationFrame(() => resultScreen.focus({ preventScroll: true }));
    },

    saveScore() {
        if(this.scoreSaved) {
            this.setSaveState("랭킹 확인 완료", "online");
            return;
        }
        this.scoreSaved = true;
        const saveStatus = this.validateRankSave();
        if(saveStatus !== "OK") {
            const messages = {
                NO_SCORE: ["저장할 점수가 없어요", "0점은 랭킹에 저장하지 않아요"],
                BAD_SCORE: ["랭킹 저장 차단", "비정상 점수는 저장하지 않아요"],
                TOO_FAST: ["랭킹 저장 차단", "플레이 시간이 너무 짧아 저장하지 않았어요"],
                COOLDOWN: ["잠깐 쉬었다 저장", "너무 잦은 저장은 잠시 막아요"],
            };
            const [label, toast] = messages[saveStatus] || messages.BAD_SCORE;
            this.setSaveState(label, "blocked");
            this.showToast(toast);
            return;
        }
        if(!db) {
            const best = this.getLocalBest();
            const message = this.score >= best ? "기기 최고점 저장 완료" : "기기 최고점 유지";
            this.setSaveState(message, "local");
            this.showToast(message);
            return;
        }
        const payload = {
            nick: this.nick,
            score: Math.round(this.score),
            version: SCORE_VERSION,
            updatedAt: firebase.database.ServerValue.TIMESTAMP,
        };
        localStorage.setItem(this.getSaveCooldownKey(), Date.now());
        this.setSaveState("온라인 랭킹 저장 중...", "saving");
        db.ref(`ranks/${this.getRankKey()}`).transaction((current) => {
            if(current && Number(current.score) >= payload.score) return;
            return payload;
        }, (error, committed) => {
            if(error) {
                console.warn(error);
                this.setSaveState("온라인 랭킹 저장 실패", "blocked");
                this.showToast("랭킹 저장 실패");
                return;
            }
            this.setSaveState(committed ? "온라인 최고점 저장 완료" : "온라인 최고점 유지", committed ? "online" : "local");
            this.showToast(committed ? `${this.getModeLabel()} 랭킹 저장 완료` : `${this.getModeLabel()} 기존 최고점이 더 높아요`);
        });
    },

    share() {
        const modeLabel = this.getModeLabel();
        const text = `${this.nick}님이 사과 팡팡 ${modeLabel}에서 ${this.score.toLocaleString()}점을 달성! 내 점수 이겨봐.`;
        const shareUrl = this.buildShareUrl();
        const message = `${text} ${shareUrl}`;
        if(navigator.share) {
            navigator.share({ title: '사과 팡팡', text: message }).catch(() => {
                navigator.clipboard?.writeText(message).then(() => this.showToast("공유 문구를 복사했어요"));
            });
        } else if(navigator.clipboard) {
            navigator.clipboard.writeText(message).then(() => this.showToast("공유 문구를 복사했어요"));
        } else {
            window.prompt("공유 문구를 복사해주세요", message);
        }
    },

    check() {
        const sel = this.getSel();
        if(sel.sum === 10 && sel.items.length) {
            const points = scoreForApples(sel.items.length);
            this.score += points;
            this.cleared += sel.items.length;
            sel.items.forEach(p => this.grid[p.r][p.c].removed = true);
            this.spawnEffect(`+${points}`, sel.center.x, sel.center.y, '#2477ff');
            this.playSound("hit");
            this.spawnBurst(sel.center.x, sel.center.y);
            this.flashBoard('hit');
            this.haptic("hit");
            setTimeout(() => this.ensureBoard(), 320);
        } else {
            if(sel.items.length) {
                this.flashBoard('miss');
                this.haptic("miss");
                this.playSound("miss");
            }
            this.ensureBoard();
        }
        this.updateHud();
    },

    getSel() {
        const x1 = Math.min(this.mStart.x, this.mCurrent.x)-PAD, y1 = Math.min(this.mStart.y, this.mCurrent.y)-PAD;
        const x2 = Math.max(this.mStart.x, this.mCurrent.x)-PAD, y2 = Math.max(this.mStart.y, this.mCurrent.y)-PAD;
        const cs = Math.floor(x1/CELL), ce = Math.floor(x2/CELL), rs = Math.floor(y1/CELL), re = Math.floor(y2/CELL);
        let sum = 0, items = [];
        for(let r=Math.max(0,rs); r<=Math.min(ROWS-1,re); r++) {
            for(let c=Math.max(0,cs); c<=Math.min(COLS-1,ce); c++) {
                if(this.grid[r] && !this.grid[r][c].removed) { sum += this.grid[r][c].val; items.push({r, c}); }
            }
        }
        const center = items.length
            ? {
                x: (items.reduce((total, item) => total + item.c, 0) / items.length) * CELL + CELL / 2 + PAD,
                y: (items.reduce((total, item) => total + item.r, 0) / items.length) * CELL + CELL / 2 + PAD,
            }
            : { x: this.mCurrent.x, y: this.mCurrent.y };
        return { sum, items, center };
    },

    spawnEffect(text, x, y, color) {
        this.effects.push({ text, x, y, color, life: 42 });
    },

    spawnBurst(x, y) {
        const colors = ['#f04d3f', '#f4b63a', '#2f9d67'];
        const count = 12;
        for(let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.8 + Math.random() * 2.8;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 0.6,
                color: colors[i % colors.length],
                life: 28 + Math.random() * 18,
                size: 2 + Math.random() * 3,
            });
        }
    },

    drawApple(apple, selected) {
        const ctx = this.ctx;
        const drawBodyPath = () => {
            ctx.beginPath();
            ctx.moveTo(0, -16);
            ctx.bezierCurveTo(-3, -18, -7, -17, -8, -14);
            ctx.bezierCurveTo(-17, -20, -22, -7, -20, 6);
            ctx.bezierCurveTo(-17, 22, -5, 22, 0, 16);
            ctx.bezierCurveTo(5, 22, 17, 22, 20, 6);
            ctx.bezierCurveTo(22, -7, 17, -20, 8, -14);
            ctx.bezierCurveTo(7, -17, 3, -18, 0, -16);
            ctx.closePath();
        };

        ctx.save();
        ctx.scale(selected ? 1.08 : 1, selected ? 1.08 : 1);

        ctx.fillStyle = 'rgba(83, 47, 15, 0.16)';
        ctx.beginPath();
        ctx.ellipse(0, 17, 15, 4.5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowColor = 'transparent';
        ctx.fillStyle = '#744820';
        ctx.fillRect(-2, -21, 4, 9);

        ctx.fillStyle = '#1fa84f';
        ctx.beginPath();
        ctx.ellipse(7, -18, 6, 3.5, -0.55, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(8, 104, 48, 0.28)';
        ctx.lineWidth = 1;
        ctx.stroke();

        const appleFill = ctx.createRadialGradient(-8, -11, 4, 3, 4, 22);
        appleFill.addColorStop(0, '#ff8a57');
        appleFill.addColorStop(0.48, '#ff3f1f');
        appleFill.addColorStop(1, '#c92b16');

        ctx.shadowColor = 'rgba(92, 30, 12, 0.24)';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 3;
        drawBodyPath();
        ctx.fillStyle = appleFill;
        ctx.fill();

        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = selected ? '#fff2a8' : 'rgba(132, 33, 18, 0.5)';
        ctx.lineWidth = selected ? 3 : 2;
        drawBodyPath();
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.72)';
        ctx.beginPath();
        ctx.ellipse(-8, -9, 6, 3.5, -0.55, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.26)';
        ctx.beginPath();
        ctx.ellipse(7, 1, 3.5, 9, -0.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 3, 12.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 253, 235, 0.98)';
        ctx.fill();
        ctx.strokeStyle = selected ? '#ffd744' : 'rgba(99, 31, 17, 0.52)';
        ctx.lineWidth = selected ? 2.5 : 1.5;
        ctx.stroke();

        ctx.font = "900 20px Montserrat, 'Noto Sans KR'";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineJoin = "round";
        ctx.fillStyle = '#3a2419';
        ctx.fillText(apple.val, 0, 3);
        ctx.restore();
    },

    drawRoundRect(ctx, x, y, w, h, radius) {
        ctx.beginPath();
        if(ctx.roundRect) {
            ctx.roundRect(x, y, w, h, radius);
            return;
        }
        const r = Math.min(radius, w / 2, h / 2);
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    },

    drawTutorialHint(now) {
        const hint = this.tutorialHint;
        if(!this.active || !hint) return;
        const elapsed = now - hint.startedAt;
        if(elapsed > hint.duration) {
            this.tutorialHint = null;
            return;
        }
        const fade = elapsed > hint.duration - 650 ? Math.max(0, (hint.duration - elapsed) / 650) : 1;
        const pulse = 1 + Math.sin(elapsed / 150) * 0.06;
        const ctx = this.ctx;
        const x = hint.rect.x - 5;
        const y = hint.rect.y - 5;
        const w = hint.rect.w + 10;
        const h = hint.rect.h + 10;
        const label = "합계 10";

        ctx.save();
        ctx.globalAlpha = fade;
        ctx.fillStyle = 'rgba(255, 215, 68, 0.14)';
        ctx.strokeStyle = '#ff8a1c';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        this.drawRoundRect(ctx, x, y, w, h, 10);
        ctx.fill();
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.font = "900 17px Montserrat, 'Noto Sans KR'";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const labelW = ctx.measureText(label).width + 28;
        const labelX = hint.center.x;
        const labelY = Math.max(25, y - 18);
        ctx.translate(labelX, labelY);
        ctx.scale(pulse, pulse);
        this.drawRoundRect(ctx, -labelW / 2, -16, labelW, 32, 16);
        ctx.fillStyle = 'rgba(255, 252, 241, 0.94)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 138, 28, 0.58)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#203024';
        ctx.fillText(label, 0, 1);
        ctx.restore();
    },

    flashBoard(type) {
        const wrap = document.getElementById('stage-wrap');
        wrap.classList.remove(type);
        void wrap.offsetWidth;
        wrap.classList.add(type);
        setTimeout(() => wrap.classList.remove(type), 280);
    },

    updateHud() {
        document.getElementById('v-time').innerText = this.time;
        document.getElementById('v-score').innerText = this.score.toLocaleString();
        document.querySelector('.time-stat')?.classList.toggle('warning', this.active && this.time <= 10);
    },

    loop() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        const boardW = COLS * CELL + PAD * 2;
        const boardH = ROWS * CELL + PAD * 2;
        this.ctx.save();
        this.ctx.fillStyle = '#f8fff3';
        this.ctx.fillRect(0, 0, boardW, boardH);
        for(let r = 0; r < ROWS; r++) {
            for(let c = 0; c < COLS; c++) {
                this.ctx.fillStyle = (r + c) % 2 ? '#f8fff3' : '#eaf8e2';
                this.ctx.fillRect(PAD + c * CELL, PAD + r * CELL, CELL, CELL);
            }
        }
        this.ctx.strokeStyle = 'rgba(5, 106, 42, 0.1)';
        this.ctx.lineWidth = 1;
        for(let c = 0; c <= COLS; c++) {
            const x = PAD + c * CELL;
            this.ctx.beginPath();
            this.ctx.moveTo(x, PAD);
            this.ctx.lineTo(x, PAD + ROWS * CELL);
            this.ctx.stroke();
        }
        for(let r = 0; r <= ROWS; r++) {
            const y = PAD + r * CELL;
            this.ctx.beginPath();
            this.ctx.moveTo(PAD, y);
            this.ctx.lineTo(PAD + COLS * CELL, y);
            this.ctx.stroke();
        }
        this.ctx.restore();

        const now = performance.now();
        const selItems = this.dragging ? this.getSel().items : [];
        const hintItems = this.tutorialHint && now - this.tutorialHint.startedAt <= this.tutorialHint.duration
            ? this.tutorialHint.items
            : [];

        for(let r=0; r<ROWS; r++) {
            for(let c=0; c<COLS; c++) {
                if(!this.grid[r]) continue;
                const a = this.grid[r][c];
                a.scale += ((a.removed ? 0 : 1) - a.scale) * 0.15;
                if(a.scale > 0.01) {
                    this.ctx.save();
                    this.ctx.translate(c*CELL + CELL/2 + PAD, r*CELL + CELL/2 + PAD);
                    this.ctx.scale(a.scale, a.scale);
                    const selected = selItems.some(s=>s.r===r && s.c===c) || hintItems.some(s=>s.r===r && s.c===c);
                    this.drawApple(a, selected);
                    this.ctx.restore();
                }
            }
        }
        this.drawTutorialHint(now);
        if(this.dragging) {
            const sel = this.getSel();
            this.ctx.strokeStyle = sel.sum === 10 ? '#ff3f1f' : '#1fa84f';
            this.ctx.fillStyle = sel.sum === 10 ? 'rgba(255,63,31,0.12)' : 'rgba(31,168,79,0.08)';
            this.ctx.lineWidth = sel.sum === 10 ? 3 : 2;
            this.ctx.setLineDash([5,5]);
            this.ctx.fillRect(this.mStart.x, this.mStart.y, this.mCurrent.x-this.mStart.x, this.mCurrent.y-this.mStart.y);
            this.ctx.strokeRect(this.mStart.x, this.mStart.y, this.mCurrent.x-this.mStart.x, this.mCurrent.y-this.mStart.y);
            if(sel.sum > 0) {
                const isTouch = this.pointerType === "touch" || this.pointerType === "pen";
                const labelX = isTouch ? this.mCurrent.x : this.mCurrent.x;
                const labelY = isTouch ? Math.max(32, this.mCurrent.y - 62) : this.mCurrent.y - 20;
                this.ctx.fillStyle = sel.sum === 10 ? '#ff3f1f' : '#203024';
                this.ctx.font = "900 24px Montserrat, 'Noto Sans KR'";
                this.ctx.textAlign = "center";
                if(isTouch) {
                    this.ctx.save();
                    this.ctx.globalAlpha = 0.9;
                    this.ctx.fillStyle = 'rgba(255,252,241,0.92)';
                    this.ctx.beginPath();
                    this.ctx.arc(labelX, labelY - 8, 24, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                    this.ctx.fillStyle = sel.sum === 10 ? '#ff3f1f' : '#203024';
                }
                this.ctx.fillText(sel.sum, labelX, labelY);
                if(isTouch) {
                    this.ctx.strokeStyle = 'rgba(36,119,255,0.42)';
                    this.ctx.lineWidth = 1;
                    this.ctx.setLineDash([]);
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.mCurrent.x, this.mCurrent.y - 12);
                    this.ctx.lineTo(labelX, labelY + 12);
                    this.ctx.stroke();
                }
            }
        }
        this.effects = this.effects.filter(effect => effect.life > 0);
        this.effects.forEach((effect) => {
            this.ctx.save();
            this.ctx.globalAlpha = Math.max(0, effect.life / 42);
            this.ctx.fillStyle = effect.color;
            this.ctx.font = "900 26px Montserrat, 'Noto Sans KR'";
            this.ctx.textAlign = "center";
            this.ctx.fillText(effect.text, effect.x, effect.y);
            this.ctx.restore();
            effect.y -= 0.7;
            effect.life--;
        });
        this.particles = this.particles.filter(particle => particle.life > 0);
        this.particles.forEach((particle) => {
            this.ctx.save();
            this.ctx.globalAlpha = Math.max(0, particle.life / 46);
            this.ctx.fillStyle = particle.color;
            this.ctx.beginPath();
            this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.restore();
            particle.x += particle.vx;
            particle.y += particle.vy;
            particle.vy += 0.08;
            particle.life--;
        });
        requestAnimationFrame(() => this.loop());
    }
};

Game.init();
</script>
</body>
</html>
